version: "1.0"
namespace: windows.shell.logon

# Logon — "Welcome to Windows" before the first desktop frame.
#
# The shell hands the base compositor the function `options.logon`; it draws
# a dialog on the same terminal and returns the user identity under which the
# compositor spawns every window. The shell does not know who checks the
# password: the application names a function through the environment
# (WINDOWS_LOGON_FUNC), and that function answers with a session
# token, while the token store (WINDOWS_TOKEN_STORE) turns the
# token back into an actor and a scope. Without these two names the shell
# comes up without logon, as before: windows under its own actor.

entries:
  # windows.shell.logon:screen
  #
  # The dialog itself: an SDK component tree inside the theme's dialog window,
  # both frame modes. It has no renderer of its own — the frame is drawn by
  # the theme, the fields and buttons by the shared SDK renderer, the same one
  # "Run…" uses.
  - name: screen
    kind: library.lua
    meta:
      comment: Logon dialog on the compositor terminal — an SDK tree in the theme's dialog window; returns an identity or the reason for refusal.
    source: file://screen.lua
    modules:
      - channel
    imports:
      chrome: windows.shell.theme:chrome
      chrome_pixels: windows.shell.theme:chrome_pixels
      ui: windows.shell.sdk:ui
      cells: windows.shell.sdk:cells
      input: windows.tui_desktop.desktop:input

  # windows.shell.logon:provider
  #
  # Identity from login and password. The library gets ITS OWN modules, but
  # the permissions belong to the shell process: funcs.call on the logon
  # function, token_store.get and token.validate on the store — see
  # security:shell_runtime.
  - name: provider
    kind: library.lua
    meta:
      comment: Login and password → the application's logon function → token → actor and scope from the token store.
    source: file://provider.lua
    modules:
      - funcs
      - security
    imports:
      environment: windows.shell.config:environment
