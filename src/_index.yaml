version: "1.0"
namespace: butschster.windows

# A Windows 95 style shell for the terminal desktop.
#
# There is no window mechanics of its own here: window hosting, PTY, the
# command channel and the store of apps built on the fly stay in
# butschster/tui-desktop. This module brings three things — the look (the
# theme), the desktop layout (its own table) and the program menu, built from
# the registry.
#
# The split everything else stands on: the registry declares what can be
# launched; the shell stores what lies where. The program list is not kept in
# state — otherwise an installed module would not appear until someone
# pressed "refresh"; a shortcut's position is not kept in the registry —
# otherwise dragging an icon would edit the sources.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Windows Shell
      description: A Windows 95 style shell for the terminal desktop — teal desktop, a taskbar with Start and a clock, a program menu built from the registry and a shortcut layout the user rearranges.

  # ─── Dependencies ────────────────────────────────────────────────────
  - version: "*"
    name: dep.wippy.migration
    kind: ns.dependency
    meta:
      comment: Migration for the desktop layout table.
    component: wippy/migration

  # The shell is an add-on over the base, not a copy of it. From here come
  # the compositor, the window host, PTY windows, the command channel and the
  # workshop.
  - version: "*"
    name: dep.butschster.tui_desktop
    kind: ns.dependency
    meta:
      comment: The desktop base — compositor, windows and command channel. The shell calls its compositor with its own theme.
    component: butschster/tui-desktop

  # ─── What the module asks of the application ─────────────────────────
  - name: target_db
    kind: ns.requirement
    meta:
      comment: The database where the desktop layout is stored — shortcuts and desktop folders.
    default: app:db
    targets:
      - entry: butschster.windows.migrations:01_create_desktop_items
        path: .meta.target_db
      - entry: butschster.windows.migrations:02_desktop_items_unplaced
        path: .meta.target_db

  # There is NO font folder here, and that is not an omission.
  # `ns.requirement` writes a field into the entry, and a process does not
  # read its entry's fields about itself — the value would simply get
  # nowhere, and the requirement would become a decoration that looks like a
  # setting. The folder is named by the environment: BUTSCHSTER_WINDOWS_FONTS,
  # default `app:system_fonts`. The database is named the same way.

  - name: api_router
    kind: ns.requirement
    meta:
      comment: The HTTP router the shell handlers attach to. It must require authentication and endpoint_firewall.
    default: app:api
    targets:
      - entry: butschster.windows.api:list_programs.endpoint
        path: .meta.router
      - entry: butschster.windows.api:list_desktop.endpoint
        path: .meta.router
      - entry: butschster.windows.api:create_desktop_item.endpoint
        path: .meta.router
      - entry: butschster.windows.api:update_desktop_item.endpoint
        path: .meta.router
      - entry: butschster.windows.api:delete_desktop_item.endpoint
        path: .meta.router
      - entry: butschster.windows.api:shell_status.endpoint
        path: .meta.router

  # ─── Host ────────────────────────────────────────────────────────────
  # The only process on the real stdin/stdout/stderr is the shell.
  #
  # hide_logs is mandatory: the surface differ considers itself the only
  # writer to the terminal, and a log line knocks the frame apart for good.
  #
  # ATTENTION, host application: terminal host autodetection in the CLI is
  # just a count of `terminal.host` entries in the whole registry. Installing
  # this module next to the base makes three of them, and EVERY command of
  # the application requires an explicit `--host`. This is the price of a
  # second shell, not a defect.
  - name: terminal
    kind: terminal.host
    hide_logs: true
    lifecycle:
      auto_start: true

  # The window host is not declared here: windows are spawned by the base's
  # compositor on its own `butschster.tui_desktop:workers`. A second host
  # would mean a second copy of the window mechanics, which would diverge
  # from the original on the first edit.

  # ─── Shell ───────────────────────────────────────────────────────────
  # butschster.windows:shell
  - name: shell
    kind: process.lua
    meta:
      comment: The Windows 95 shell — the base's compositor with its own theme, its own catalog and its own desktop layout.
      command:
        name: windows
        short: A Windows 95 style shell for the terminal desktop
        security:
          actor: {id: butschster.windows:shell}
          policies: [butschster.windows.security:shell_runtime]
    source: file://windows.lua
    method: main
    modules:
      - channel
      - env
      # The font arrives as bytes through fs, and the cell size is asked of
      # gfx: the mechanics entry does not declare them, so the shell asks.
      - fs
      - gfx
      - logger
      - process
      - registry
      - sql
      - time
      - tty
      - uuid
    imports:
      library: butschster.tui_desktop.desktop:library
      chrome: butschster.windows.shell:chrome
      chrome_pixels: butschster.windows.shell:chrome_pixels
      catalog: butschster.windows.programs:catalog
      defaults: butschster.windows.programs:defaults
      seed: butschster.windows.programs:seed
      view: butschster.windows.programs:desktop_view
      repo: butschster.windows.persist:repo
      patterns: butschster.windows.display:patterns
      wallpapers: butschster.windows.display:wallpapers
      logon_screen: butschster.windows.logon:screen
      logon_provider: butschster.windows.logon:provider
      environment: butschster.windows.config:environment
