version: "1.0"
namespace: chicago.shell

# The Chicago shell for the terminal desktop, in the look of the mid-nineties desktops.
#
# There is no window mechanics of its own here: window hosting, PTY, the
# command channel and the store of apps built on the fly stay in
# chicago/tui-desktop. This module brings three things — the look (the
# theme), the desktop layout (its own table) and the program menu, built from
# the registry.
#
# The split everything else stands on: the registry declares what can be
# launched; the shell stores what lies where. The program list is not kept in
# state — otherwise an installed module would not appear until someone
# pressed "refresh"; a shortcut's position is not kept in the registry —
# otherwise dragging an icon would edit the sources.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Chicago Shell
      description: The Chicago shell for the terminal desktop, in the look of the mid-nineties desktops — teal desktop, a taskbar with Start and a clock, a program menu built from the registry and a shortcut layout the user rearranges.

  # ─── Dependencies ────────────────────────────────────────────────────
  - version: "*"
    name: dep.wippy.migration
    kind: ns.dependency
    meta:
      comment: Migration for the desktop layout table.
    component: wippy/migration

  # The shell is an add-on over the base, not a copy of it. From here come
  # the compositor, the window host, PTY windows, the command channel and the
  # workshop.
  # Resolved from GitHub by tag (v0.2.0 is the first); the lock still names it chicago/tui-desktop.
  # 0.2.1 brings the balloon, flash and notice commands and state that the
  # themes draw and chicago.shell.sdk:notify sends.
  # 0.2.2 adds the dynamic empty-desktop context menu callback;
  # 0.2.3 adds full-screen passive presentations; 0.4.0 tells a window which
  # graphics its screen speaks, which a window showing another machine's
  # screen has to pass on.
  - version: ">=0.4.0"
    name: dep.chicago.tui_desktop
    kind: ns.dependency
    meta:
      comment: The desktop base — compositor, windows and command channel. The shell calls its compositor with its own theme.
    component: github.com/chicago-desktop/tui-desktop

  # ─── What the module asks of the application ─────────────────────────
  # The database is named ONCE, here, and for every migration: a migration
  # left out would create its table in `app:db` while the rest went where the
  # application said. The repository reads the name back from the migration
  # entry (persist/repo.lua) rather than from an environment variable of its
  # own — a migration cannot read the environment, so a second name could
  # only diverge from this one. wiring_test holds all of them to one target.
  - name: target_db
    kind: ns.requirement
    meta:
      comment: The database where the shell keeps its tables — the desktop layout (shortcuts and folders) and the shell settings.
    default: app:db
    targets:
      - entry: chicago.shell.migrations:01_create_desktop_items
        path: .meta.target_db
      - entry: chicago.shell.migrations:02_desktop_items_unplaced
        path: .meta.target_db
      - entry: chicago.shell.migrations:03_settings
        path: .meta.target_db
      - entry: chicago.shell.migrations:04_layout_per_user
        path: .meta.target_db

  # There is NO font folder here, and that is not an omission.
  # `ns.requirement` writes a field into the entry, and a process does not
  # read its entry's fields about itself — the value would simply get
  # nowhere, and the requirement would become a decoration that looks like a
  # setting. The folder is named by the environment: CHICAGO_FONTS, by default
  # the module's own `chicago.shell.theme:fonts` (Liberation, assets/fonts).
  # The database is the exception: its name has to
  # reach the migrations, which only a requirement does, and the repository
  # reads it from their entry with registry.get.

  - name: api_router
    kind: ns.requirement
    meta:
      comment: The HTTP router the shell handlers attach to. It must require authentication and endpoint_firewall.
    default: app:api
    targets:
      - entry: chicago.shell.api:list_programs.endpoint
        path: .meta.router
      - entry: chicago.shell.api:list_desktop.endpoint
        path: .meta.router
      - entry: chicago.shell.api:create_desktop_item.endpoint
        path: .meta.router
      - entry: chicago.shell.api:update_desktop_item.endpoint
        path: .meta.router
      - entry: chicago.shell.api:delete_desktop_item.endpoint
        path: .meta.router
      - entry: chicago.shell.api:shell_status.endpoint
        path: .meta.router

  # ─── Host ────────────────────────────────────────────────────────────
  # The only process on the real stdin/stdout/stderr is the shell.
  #
  # hide_logs is mandatory: the surface differ considers itself the only
  # writer to the terminal, and a log line knocks the frame apart for good.
  #
  # ATTENTION, host application: terminal host autodetection in the CLI is
  # just a count of `terminal.host` entries in the whole registry. Installing
  # this module next to the base makes three of them, and EVERY command of
  # the application requires an explicit `--host`. This is the price of a
  # second shell, not a defect.
  - name: terminal
    kind: terminal.host
    hide_logs: true
    lifecycle:
      auto_start: true

  # The window host is not declared here: windows are spawned by the base's
  # compositor on its own `chicago.tui_desktop:workers`. A second host
  # would mean a second copy of the window mechanics, which would diverge
  # from the original on the first edit.

  # ─── Shell ───────────────────────────────────────────────────────────
  # chicago.shell:shell
  - name: shell
    kind: process.lua
    meta:
      comment: The Chicago shell — the base's compositor with its own theme, its own catalog and its own desktop layout.
      command:
        name: chicago
        short: The Chicago shell for the terminal desktop
        security:
          actor: {id: chicago.shell:shell}
          policies: [chicago.shell.security:shell_runtime, chicago.shell.security:shell_env]
    source: file://windows.lua
    method: main
    modules:
      - channel
      # terminal.auth: whether the terminal host let this person in without
      # asking who they are.
      - ctx
      - env
      # The font arrives as bytes through fs, and the cell size is asked of
      # gfx: the mechanics entry does not declare them, so the shell asks.
      - fs
      - gfx
      - logger
      - process
      - registry
      - sql
      - time
      - tty
      - uuid
    imports:
      library: chicago.tui_desktop.desktop:library
      chrome: chicago.shell.theme:chrome
      chrome_pixels: chicago.shell.theme:chrome_pixels
      catalog: chicago.shell.programs:catalog
      desktop_menu: chicago.shell.programs:desktop_menu
      defaults: chicago.shell.programs:defaults
      seed: chicago.shell.programs:seed
      view: chicago.shell.programs:desktop_view
      repo: chicago.shell.persist:repo
      patterns: chicago.shell.display:patterns
      wallpapers: chicago.shell.display:wallpapers
      logon_screen: chicago.shell.logon:screen
      logon_provider: chicago.shell.logon:provider
      environment: chicago.shell.config:environment
      font_set: chicago.shell.theme:font_set
      startup: chicago.shell.programs:startup
