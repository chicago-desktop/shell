version: "1.0"
namespace: butschster.windows.appwiz

# "Add/Remove Programs" is appwiz, as in Windows. A program here is a wippy
# module; the window shows declared and cached modules and edits the
# application's declarations file. `wippy update` installs and removes them
# after a restart; the window says so rather than pretending.

entries:
  # butschster.windows.appwiz:model
  - name: model
    kind: library.lua
    meta:
      comment: The pure model of the install panel — merging declarations with the cache, editing the declarations text, the name of a new entry.
    source: file://model.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry

  # Permissions: the same as the view provider's (context, the compositor in
  # the process registry, sending state to it), plus reading the registry and
  # the module cache, the environment (the name of the declarations folder)
  # and the folder itself. The window can neither spawn processes nor change
  # the registry: it has nothing to remove a module from the running runtime
  # with, and the permissions do not grant that.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Permissions of the install panel — read the registry and the module cache, read and write the declarations folder, publish state to the compositor; do not touch processes or the registry.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - registry.get
        - registry.find
        - registry.entry
        - env.get
        - fs.get
        - hub.cache.list
      resources: "*"
      effect: allow

  # butschster.windows.appwiz:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Add/Remove Programs
      image: appwizard
      icon: "▦"
      group: Settings
      order: 100
      width: 76
      height: 22
      window_type: app
      resizable: true
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.appwiz:window
      comment: Add/Remove Programs — wippy modules from the application's declarations and the cache; remove and add a declaration, takes effect after wippy update and a restart.
    source: file://window.lua
    method: main
    modules:
      - env
      - fs
      - hub
      - registry
      - time
    security:
      policies: [butschster.windows.appwiz:window_scope]
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      app: butschster.windows.sdk:app
      model: butschster.windows.appwiz:model
      environment: butschster.windows.config:environment
