version: "1.0"
namespace: butschster.windows.api

# Shell endpoints: the program catalog for reading, and the desktop layout
# for reading and writing.
#
# There is no endpoint to CREATE a program here, and there will not be one.
# Programs are declared by the registry — by installing a module or by
# building a window through the base workshop (POST /tui-desktop/apps). A
# creation endpoint of our own would mean a second source of truth next to
# the registry, and the two would diverge on the first module removal.

entries:
  # butschster.windows.api:control
  #
  # The compositor rereads the layout on command, not every frame, so an
  # endpoint that changed a row is obliged to nudge it. Otherwise the icon
  # appears only after a restart, and the endpoint looks like it did not work.
  - name: control
    kind: library.lua
    meta:
      comment: Find the shell by name, send a command, wait for the answer. A shell that is shut down is told apart from one that did not answer.
    source: file://control.lua
    modules:
      - channel
      - process
      - time
    imports:
      # The rule of desktop names (name, name.2, …): one shell per terminal.ssh
      # connection, and a refresh has to reach every one.
      desktop: butschster.tui_desktop.desktop:window_api

  # butschster.windows.api:list_programs
  - name: list_programs
    kind: function.lua
    meta:
      comment: GET /windows/programs — the catalog from the registry, menu folders and order. A registry failure is returned as a failure, not as an empty list.
    source: file://list_programs.lua
    method: handler
    modules:
      - http
      - security
      - registry
    imports:
      catalog: butschster.windows.programs:catalog
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: list_programs.endpoint
    kind: http.endpoint
    meta:
      comment: The program catalog behind the authenticated router.
      router: app:api
    method: GET
    func: list_programs
    path: /windows/programs

  # butschster.windows.api:list_desktop
  - name: list_desktop
    kind: function.lua
    meta:
      comment: GET /windows/desktop — desktop shortcuts and folders; a shortcut to a vanished entry is marked broken, not removed.
    source: file://list_desktop.lua
    method: handler
    modules:
      - http
      - security
      - registry
      - sql
      - time
      - uuid
    imports:
      repo: butschster.windows.persist:repo
      catalog: butschster.windows.programs:catalog
      view: butschster.windows.programs:desktop_view
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: list_desktop.endpoint
    kind: http.endpoint
    meta:
      comment: The desktop layout behind the authenticated router.
      router: app:api
    method: GET
    func: list_desktop
    path: /windows/desktop

  # butschster.windows.api:desktop_body
  #
  # The body of desktop POST and PATCH — parsing and validation in one place,
  # without HTTP or the database, so that every refusal is checked by a test
  # without a server.
  - name: desktop_body
    kind: library.lua
    meta:
      comment: Validation of desktop request bodies — a JSON object, finite whole coordinates, length caps, a folder does not nest in a folder, null only on a top-level key.
    source: file://desktop_body.lua
    modules:
      - json
    imports:
      repo: butschster.windows.persist:repo

  # butschster.windows.api:create_desktop_item
  - name: create_desktop_item
    kind: function.lua
    meta:
      comment: POST /windows/desktop — create a desktop shortcut or folder.
    source: file://create_desktop_item.lua
    method: handler
    modules:
      - http
      - json
      - security
      - registry
      - sql
      - time
      - uuid
      - channel
      - process
    imports:
      repo: butschster.windows.persist:repo
      catalog: butschster.windows.programs:catalog
      control: butschster.windows.api:control
      desktop_body: butschster.windows.api:desktop_body
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: create_desktop_item.endpoint
    kind: http.endpoint
    meta:
      comment: Creating a desktop shortcut or folder behind the authenticated router.
      router: app:api
    method: POST
    func: create_desktop_item
    path: /windows/desktop

  # butschster.windows.api:update_desktop_item
  - name: update_desktop_item
    kind: function.lua
    meta:
      comment: PATCH /windows/desktop/{id} — move or rename; entry and kind do not change.
    source: file://update_desktop_item.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - time
      - uuid
      - channel
      - process
    imports:
      repo: butschster.windows.persist:repo
      control: butschster.windows.api:control
      desktop_body: butschster.windows.api:desktop_body
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: update_desktop_item.endpoint
    kind: http.endpoint
    meta:
      comment: Moving and renaming behind the authenticated router.
      router: app:api
    method: PATCH
    func: update_desktop_item
    path: /windows/desktop/{id}

  # butschster.windows.api:delete_desktop_item
  - name: delete_desktop_item
    kind: function.lua
    meta:
      comment: DELETE /windows/desktop/{id} — remove a shortcut or folder; the answer says whether the row existed.
    source: file://delete_desktop_item.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - time
      - uuid
      - channel
      - process
    imports:
      repo: butschster.windows.persist:repo
      control: butschster.windows.api:control
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: delete_desktop_item.endpoint
    kind: http.endpoint
    meta:
      comment: Deleting a shortcut or folder behind the authenticated router.
      router: app:api
    method: DELETE
    func: delete_desktop_item
    path: /windows/desktop/{id}

  # butschster.windows.api:shell_status
  #
  # The restore report for workshop windows is visible only here: the
  # terminal host log is muted, and a failure told to the log is told to
  # no one.
  - name: shell_status
    kind: function.lua
    meta:
      comment: GET /windows/status — whether the shell is alive, its windows, and the restore report for workshop windows.
    source: file://shell_status.lua
    method: handler
    modules:
      - http
      - security
      - channel
      - process
      - time
    imports:
      control: butschster.windows.api:control
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: shell_status.endpoint
    kind: http.endpoint
    meta:
      comment: Shell state behind the authenticated router.
      router: app:api
    method: GET
    func: shell_status
    path: /windows/status
