version: "1.0"
namespace: butschster.windows.api

# Ручки оболочки: каталог программ на чтение и раскладка рабочего стола на
# чтение и запись.
#
# Ручки на СОЗДАНИЕ программы здесь нет и не будет. Программы объявляет
# реестр — установкой модуля или сборкой окна через мастерскую основы
# (POST /tui-desktop/apps). Своя ручка создания означала бы второй источник
# истины рядом с реестром, и разошлись бы они на первом удалении модуля.

entries:
  # butschster.windows.api:control
  #
  # Раскладку композитор перечитывает по команде, а не каждый кадр, поэтому
  # ручка, изменившая строку, обязана его толкнуть. Иначе значок появляется
  # только после перезапуска, и ручка выглядит не сработавшей.
  - name: control
    kind: library.lua
    meta:
      comment: Найти оболочку по имени, послать команду, дождаться ответа. Погашенная оболочка отличается от неответившей.
    source: file://control.lua
    modules:
      - channel
      - process
      - time

  # butschster.windows.api:list_programs
  - name: list_programs
    kind: function.lua
    meta:
      comment: GET /windows/programs — каталог из реестра, папки меню и порядок. Отказ реестра отдаётся как отказ, а не как пустой список.
    source: file://list_programs.lua
    method: handler
    modules:
      - http
      - security
      - registry
    imports:
      catalog: butschster.windows.programs:catalog
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: list_programs.endpoint
    kind: http.endpoint
    meta:
      comment: Каталог программ за аутентифицированным роутером.
      router: app:api
    method: GET
    func: list_programs
    path: /windows/programs

  # butschster.windows.api:list_desktop
  - name: list_desktop
    kind: function.lua
    meta:
      comment: GET /windows/desktop — ярлыки и папки стола; ярлык на исчезнувшую запись помечен битым, а не убран.
    source: file://list_desktop.lua
    method: handler
    modules:
      - http
      - security
      - registry
      - sql
      - env
      - time
      - uuid
    imports:
      repo: butschster.windows.persist:repo
      catalog: butschster.windows.programs:catalog
      view: butschster.windows.programs:desktop_view
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: list_desktop.endpoint
    kind: http.endpoint
    meta:
      comment: Раскладка стола за аутентифицированным роутером.
      router: app:api
    method: GET
    func: list_desktop
    path: /windows/desktop

  # butschster.windows.api:create_desktop_item
  - name: create_desktop_item
    kind: function.lua
    meta:
      comment: POST /windows/desktop — завести ярлык или папку стола.
    source: file://create_desktop_item.lua
    method: handler
    modules:
      - http
      - json
      - security
      - registry
      - sql
      - env
      - time
      - uuid
      - channel
      - process
    imports:
      repo: butschster.windows.persist:repo
      catalog: butschster.windows.programs:catalog
      control: butschster.windows.api:control
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: create_desktop_item.endpoint
    kind: http.endpoint
    meta:
      comment: Создание ярлыка или папки стола за аутентифицированным роутером.
      router: app:api
    method: POST
    func: create_desktop_item
    path: /windows/desktop

  # butschster.windows.api:update_desktop_item
  - name: update_desktop_item
    kind: function.lua
    meta:
      comment: PATCH /windows/desktop/{id} — переместить или переименовать; entry и kind не меняются.
    source: file://update_desktop_item.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - env
      - time
      - uuid
      - channel
      - process
    imports:
      repo: butschster.windows.persist:repo
      control: butschster.windows.api:control
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: update_desktop_item.endpoint
    kind: http.endpoint
    meta:
      comment: Перемещение и переименование за аутентифицированным роутером.
      router: app:api
    method: PATCH
    func: update_desktop_item
    path: /windows/desktop/{id}

  # butschster.windows.api:delete_desktop_item
  - name: delete_desktop_item
    kind: function.lua
    meta:
      comment: DELETE /windows/desktop/{id} — убрать ярлык или папку; ответ говорит, была ли строка.
    source: file://delete_desktop_item.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - env
      - time
      - uuid
      - channel
      - process
    imports:
      repo: butschster.windows.persist:repo
      control: butschster.windows.api:control
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: delete_desktop_item.endpoint
    kind: http.endpoint
    meta:
      comment: Удаление ярлыка или папки за аутентифицированным роутером.
      router: app:api
    method: DELETE
    func: delete_desktop_item
    path: /windows/desktop/{id}

  # butschster.windows.api:shell_status
  #
  # Отчёт восстановления окон мастерской виден только здесь: лог терминального
  # хоста заглушён, и отказ, рассказанный в лог, не рассказан никому.
  - name: shell_status
    kind: function.lua
    meta:
      comment: GET /windows/status — жива ли оболочка, её окна и отчёт восстановления окон мастерской.
    source: file://shell_status.lua
    method: handler
    modules:
      - http
      - security
      - channel
      - process
      - time
    imports:
      control: butschster.windows.api:control
    security:
      policies: [butschster.windows.security:shell_storage]

  - name: shell_status.endpoint
    kind: http.endpoint
    meta:
      comment: Состояние оболочки за аутентифицированным роутером.
      router: app:api
    method: GET
    func: shell_status
    path: /windows/status
