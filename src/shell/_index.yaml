version: "1.0"
namespace: butschster.windows.shell

# Вид оболочки и ничего больше.
#
# Четыре библиотеки вместо одной — по границе, на которой их правят. Символы
# меняют, глядя на экран; цвета — глядя на эталонный кадр; примитивы — глядя
# на деталь; тему — глядя на контракт композитора. Слитые в один файл, они
# правятся вслепую.
#
# Важнее другое. Рисуют этими примитивами ДВОЕ — тема снаружи окна и само
# окно внутри своего viewport. Поэтому всё, что не знает про экран целиком,
# лежит отдельно от темы и импортируется обоими. Своя копия у окна разошлась
# бы с рамкой вокруг него, и разошлась бы видом, а не отказом.
#
# Ни одна из них не ходит в рантайм — только строки и арифметика. Поэтому их
# можно мерить тестом без терминала, а это единственный способ поймать
# разъехавшуюся на ячейку рамку, пока она не уехала на стенд.
#
# ЛОВУШКА ЭТОГО ФАЙЛА. Двоеточие с пробелом внутри незакавыченного значения
# YAML читает как начало новой пары, и отказ приходит от загрузчика записей
# с указанием на файл, а не на фразу. В комментариях ниже двоеточий нет
# нарочно.

entries:
  # butschster.windows.shell:palette
  - name: palette
    kind: library.lua
    meta:
      comment: Палитра точными цветами Windows 95 и те же имена базовыми индексами ANSI как запасной путь.
    source: file://palette.lua

  # butschster.windows.shell:glyphs
  - name: glyphs
    kind: library.lua
    meta:
      comment: Псевдографика оболочки — грани объёма, кнопки, полоса прокрутки, значки. Каждый символ шириной ровно в одну ячейку.
    source: file://glyphs.lua

  # butschster.windows.shell:widgets
  #
  # Примитивы, не знающие про экран. Их импортирует и тема, и окно.
  - name: widgets
    kind: library.lua
    meta:
      comment: Объёмные детали Windows 95 — грани, панель, вдавленное поле, кнопка, этчед-разделитель, строка меню, панель инструментов, статусная строка, вкладки.
    source: file://widgets.lua
    modules:
      - tty
    imports:
      text: butschster.tui_desktop.desktop:text
      scroll: butschster.tui_desktop.desktop:scroll
      glyphs: butschster.windows.shell:glyphs
      palette: butschster.windows.shell:palette

  # butschster.windows.shell:icons
  #
  # Значок рисуют двое — стол композитором и окно «Мой компьютер» само.
  - name: icons
    kind: library.lua
    meta:
      comment: Значок с подписью, один на всю оболочку — и для рабочего стола, и для списка объектов внутри окна.
    source: file://icons.lua
    modules:
      - tty
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      glyphs: butschster.windows.shell:glyphs
      palette: butschster.windows.shell:palette

  # butschster.windows.shell:pixels
  #
  # Пиксельный двойник примитивов. Растров не создаёт — растр приходит
  # снаружи, от того, кто хранит его между кадрами; примитив, создающий свой
  # растр, заставил бы тему переотправлять всё каждый кадр.
  - name: pixels
    kind: library.lua
    meta:
      comment: Windows 95 pixel primitives — a one-pixel edge, panel, sunken field, button, marks, icons; paints pixels at a place named in cells, while the caller's layout computes the hits.
    source: file://pixels.lua
    modules:
      - gfx
    imports:
      text: butschster.tui_desktop.desktop:text
      geometry: butschster.tui_desktop.desktop:geometry
      palette: butschster.windows.shell:palette
      images: butschster.windows.shell:images

  # butschster.windows.shell:rasters
  #
  # Растры переживают кадр, и это не оптимизация. Тема, создающая растр в
  # функции отрисовки, рисует ПРАВИЛЬНЫЙ экран и переотправляет его целиком
  # каждый кадр — сорок семь миллисекунд на нажатие клавиши вместо одной.
  # Глазами это не видно, у медленного нет стека вызовов.
  - name: rasters
    kind: library.lua
    meta:
      comment: Хранилище растров между кадрами — отдаёт растр по имени и ключу состояния и говорит, надо ли в него рисовать; чего в кадре не назвали, то уходит с экрана.
    source: file://rasters.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
    modules:
      - gfx

  # butschster.windows.shell:chrome_pixels
  #
  # Пиксельная тема. Отдельной записью по тому же правилу, что и пиксельный
  # бэкенд проводника: запись, объявившая `gfx`, на рантайме без него не
  # грузится целиком, и путь в ячейках умер бы вместе с графикой.
  - name: chrome_pixels
    kind: library.lua
    meta:
      comment: Пиксельная тема оболочки — заливка остаётся ячейками, пикселями только фаски, значки и подписи; рамка окна нарезана по строкам, чтобы набор текста внутри стоил двух полосок.
    source: file://chrome_pixels.lua
    modules:
      - gfx
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      # Состав кнопок заголовка берётся у темы в ячейках: одна таблица на оба
      # режима. Второй список разошёлся бы с первым, и у диалога в пикселях
      # оказалось бы три кнопки, а в ячейках две.
      chrome: butschster.windows.shell:chrome
      icons: butschster.windows.shell:icons
      palette: butschster.windows.shell:palette
      pixels: butschster.windows.shell:pixels
      rasters: butschster.windows.shell:rasters
      widgets: butschster.windows.shell:widgets
      explorer_layout: butschster.windows.explorer:render
      explorer_pixels: butschster.windows.explorer:render_pixels
      # Окна-виды. Композитор не умеет загрузить библиотеку по id из записи
      # окна — require знает только imports, — поэтому каждый render
      # импортирован сюда статически и назван в VIEWS темы.
      picture_render: butschster.windows.viewers:picture_render
      sdk_render: butschster.windows.sdk:render

  # butschster.windows.shell:chrome
  #
  # Тема по контракту основы. Здесь остаётся только то, что знает про экран
  # целиком.
  - name: chrome
    kind: library.lua
    meta:
      comment: Тема по контракту основы — рабочий стол со значками, рамка окна, панель задач и каскадное меню «Пуск».
    source: file://chrome.lua
    modules:
      - tty
    imports:
      glyphs: butschster.windows.shell:glyphs
      icons: butschster.windows.shell:icons
      palette: butschster.windows.shell:palette
      widgets: butschster.windows.shell:widgets

  # butschster.windows.shell:icon_files
  #
  # Настоящие значки Windows 95 — PNG 32×32 и 16×16 в assets/icons, см.
  # SOURCE.md там же. Каталог объявлен модулем (`base: module`), а не
  # приложением: значки — часть вида, и приложение о них знать не должно.
  # Только чтение, поэтому auto_init выключен: ни создавать, ни переставлять
  # права на каталог с чужим артворком нельзя.
  - name: icon_files
    kind: fs.directory
    meta:
      comment: Значки Windows 95 из shell32.dll в PNG — приезжают в gfx байтами, а не путём.
    base: module
    directory: ./assets/icons
    auto_init: false

  # butschster.windows.shell:images
  #
  # Растровые значки: имя → файл → декодированный растр, с кэшем на процесс.
  # Кэш обязателен, а не желателен: значок, декодированный заново на каждый
  # кадр, — новый растр с той же версией, и поверхность его не переотправит.
  - name: images
    kind: library.lua
    meta:
      comment: Real Windows 95 icons from PNG — decoded with gfx.image, laid down with blit, one "kind → name" table; a failure goes to the log once per icon.
    source: file://images.lua
    modules:
      - fs
      - gfx
      - logger
