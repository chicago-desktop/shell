version: "1.0"
namespace: butschster.windows.shell

# The look of the shell and nothing more.
#
# Four libraries instead of one — along the border at which they are edited.
# Characters are changed looking at the screen; colors — looking at the
# reference frame; primitives — looking at the detail; the theme — looking
# at the compositor's contract. Merged into one file, they are edited blind.
#
# More important is something else. TWO parties draw with these primitives —
# the theme outside the window and the window itself inside its viewport. So
# everything that does not know about the whole screen lies apart from the
# theme and is imported by both. A window's own copy would diverge from the
# frame around it, and it would diverge in looks, not in a refusal.
#
# None of them goes into the runtime — only strings and arithmetic. So they
# can be measured by a test without a terminal, and that is the only way to
# catch a frame that has slipped by a cell before it goes out to the running
# system.
#
# THE TRAP OF THIS FILE. YAML reads a colon followed by a space inside an
# unquoted value as the start of a new pair, and the refusal comes from the
# entry loader pointing at the file, not at the phrase. The comments below
# have no colons on purpose.

entries:
  # butschster.windows.shell:palette
  - name: palette
    kind: library.lua
    meta:
      comment: The palette in exact Windows 95 colors, and the same names as basic ANSI indices as a fallback.
    source: file://palette.lua

  # butschster.windows.shell:glyphs
  - name: glyphs
    kind: library.lua
    meta:
      comment: The shell's pseudographics — bevel edges, buttons, scroll bar, icons. Every character is exactly one cell wide.
    source: file://glyphs.lua

  # butschster.windows.shell:widgets
  #
  # Primitives that do not know about the screen. Both the theme and the
  # window import them.
  - name: widgets
    kind: library.lua
    meta:
      comment: Windows 95 bevelled details — edges, panel, sunken field, button, etched separator, menu bar, toolbar, status bar, tabs.
    source: file://widgets.lua
    modules:
      - tty
    imports:
      text: butschster.tui_desktop.desktop:text
      scroll: butschster.tui_desktop.desktop:scroll
      glyphs: butschster.windows.shell:glyphs
      palette: butschster.windows.shell:palette

  # butschster.windows.shell:icons
  #
  # Two parties draw the icon — the desktop through the compositor and the
  # "My Computer" window by itself.
  - name: icons
    kind: library.lua
    meta:
      comment: An icon with a caption, one for the whole shell — both for the desktop and for the list of objects inside a window.
    source: file://icons.lua
    modules:
      - tty
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      glyphs: butschster.windows.shell:glyphs
      palette: butschster.windows.shell:palette

  # butschster.windows.shell:pixels
  #
  # The pixel twin of the primitives. It creates no rasters — the raster comes
  # from outside, from whoever keeps it between frames; a primitive that
  # created its own raster would force the theme to resend everything every
  # frame.
  - name: pixels
    kind: library.lua
    meta:
      comment: Windows 95 pixel primitives — a one-pixel edge, panel, sunken field, button, marks, icons; paints pixels at a place named in cells, while the caller's layout computes the hits.
    source: file://pixels.lua
    modules:
      - gfx
    imports:
      text: butschster.tui_desktop.desktop:text
      geometry: butschster.tui_desktop.desktop:geometry
      palette: butschster.windows.shell:palette
      images: butschster.windows.shell:images

  # butschster.windows.shell:rasters
  #
  # Rasters outlive the frame, and this is not an optimization. A theme that
  # creates a raster in the draw function draws the CORRECT screen and resends
  # it whole every frame — forty-seven milliseconds per keystroke instead of
  # one. The eye does not see it; slowness has no stack trace.
  - name: rasters
    kind: library.lua
    meta:
      comment: A store of rasters between frames — hands out a raster by name and state key and says whether it needs drawing into; whatever the frame did not name leaves the screen.
    source: file://rasters.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
    modules:
      - gfx

  # butschster.windows.shell:chrome_pixels
  #
  # The pixel theme. A separate entry by the same rule as the explorer's pixel
  # backend: an entry that declared `gfx` does not load at all on a runtime
  # without it, and the cell path would die together with the graphics.
  - name: chrome_pixels
    kind: library.lua
    meta:
      comment: The shell's pixel theme — the fill stays in cells, only bevels, icons and captions are pixels; the window frame is cut by rows so that typing text inside costs two strips.
    source: file://chrome_pixels.lua
    modules:
      - gfx
    imports:
      menu_layout: butschster.windows.shell:menu_layout
      placements: butschster.windows.shell:placements
      geometry: butschster.tui_desktop.desktop:geometry
      # The set of title bar buttons is taken from the cell theme: one table
      # for both modes. A second list would diverge from the first, and a
      # dialog would end up with three buttons in pixels and two in cells.
      chrome: butschster.windows.shell:chrome
      icons: butschster.windows.shell:icons
      palette: butschster.windows.shell:palette
      pixels: butschster.windows.shell:pixels
      # The wallpaper picture, read by name like an icon.
      images: butschster.windows.shell:images
      rasters: butschster.windows.shell:rasters
      widgets: butschster.windows.shell:widgets
      explorer_layout: butschster.windows.explorer:render
      explorer_pixels: butschster.windows.explorer:render_pixels
      # View windows. The compositor cannot load a library by an id from the
      # window's entry — require knows only imports — so every render is
      # imported here statically and named in the theme's VIEWS.
      picture_render: butschster.windows.viewers:picture_render
      sdk_render: butschster.windows.sdk:render

  # butschster.windows.shell:chrome
  #
  # The theme per the base's contract. Only what knows about the whole screen
  # stays here.
  - name: chrome
    kind: library.lua
    meta:
      comment: The theme per the base's contract — the desktop with icons, the window frame, the taskbar and the cascading "Start" menu.
    source: file://chrome.lua
    modules:
      - tty
    imports:
      menu_layout: butschster.windows.shell:menu_layout
      glyphs: butschster.windows.shell:glyphs
      icons: butschster.windows.shell:icons
      palette: butschster.windows.shell:palette
      widgets: butschster.windows.shell:widgets

  # butschster.windows.shell:icon_files
  #
  # The real Windows 95 icons — PNG 32×32 and 16×16 in assets/icons, see
  # SOURCE.md in the same place. The folder is declared by the module
  # (`base: module`), not by the application: the icons are part of the look,
  # and the application should not have to know about them. Read only, so
  # auto_init is off: neither creating the folder with someone else's artwork
  # nor rearranging its permissions is allowed.
  - name: icon_files
    kind: fs.directory
    meta:
      comment: Windows 95 icons from shell32.dll as PNG — they arrive in gfx as bytes, not as a path.
    base: module
    directory: ./assets/icons
    auto_init: false

  # butschster.windows.shell:weather_files
  #
  # The weather icons — original pixel art (tools/weather_icons.py), MIT like
  # the module, in a folder of their own so that the exclusion of the
  # Microsoft artwork in wippy.yaml does not drop them from the package.
  - name: weather_files
    kind: fs.directory
    meta:
      comment: The shell's own weather icons as PNG 32×32 and 16×16 — the tray and the weather window draw them.
    base: module
    directory: ./assets/weather
    auto_init: false

  # butschster.windows.shell:images
  #
  # Raster icons: name → file → decoded raster, with a per-process cache.
  # The cache is mandatory, not desirable: an icon decoded anew every frame
  # is a new raster with the same version, and the surface will not resend it.
  - name: images
    kind: library.lua
    meta:
      comment: Real Windows 95 icons from PNG — decoded with gfx.image, laid down with blit, one "kind → name" table; a failure goes to the log once per icon.
    source: file://images.lua
    modules:
      - fs
      - gfx
      - logger
      # Image packs of other modules are found in the registry when a
      # picture is asked for; a refused one is asked again after a pause.
      - registry
      - time

  # butschster.windows.shell:menu_layout
  - name: menu_layout
    kind: library.lua
    meta:
      comment: The Start menu cascade layout for both themes — the folder tree from meta.group, the panels, their rows and the hit map; no painting, the banner arrives as a parameter.
    source: file://menu_layout.lua
    imports:
      glyphs: butschster.windows.shell:glyphs
      icons: butschster.windows.shell:icons
      widgets: butschster.windows.shell:widgets

  # butschster.windows.shell:placements
  - name: placements
    kind: library.lua
    meta:
      comment: Pure rectangle geometry of the pixel theme placements — higher windows and the menu cut lower pictures, plus the crop id and key rule.
    source: file://placements.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
