version: "1.0"
namespace: butschster.windows.display

# "Display Properties" is the Windows 95 Display Properties: the desktop
# color and information about the screen. It opens from the "Properties"
# item on a right click on the empty desktop and from "Start → Settings".

entries:
  # butschster.windows.display:model
  - name: model
    kind: library.lua
    meta:
      comment: The pure model of "Display Properties" — desktop colors, color format check, resolution and palette captions.
    source: file://model.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry

  # Permissions: read and write a setting in the shell database (`db.get` on
  # the resource, the database name comes from the environment), ask and
  # nudge the compositor.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Permissions of "Display Properties" — read and write the shell settings in the database, ask the compositor and ask it to reread the desktop.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - db.get
        - env.get
      resources: "*"
      effect: allow

  # butschster.windows.display:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: "Display Properties"
      image: display_properties
      icon: "▭"
      group: Settings
      order: 140
      window_type: dialog
      resizable: false
      width: 60
      height: 24
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.display:window
      comment: Display Properties — the desktop color with a preview, applied through the shell settings; resolution and palette are read-only; a window on the shell SDK.
    source: file://window.lua
    method: main
    modules:
      - sql
      - env
      - time
      - uuid
    security:
      policies: [butschster.windows.display:window_scope]
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      app: butschster.windows.sdk:app
      desktop: butschster.tui_desktop.desktop:window_api
      repo: butschster.windows.persist:repo
      model: butschster.windows.display:model
