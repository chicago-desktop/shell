version: "1.0"
namespace: chicago.shell.display

# Shared appearance assets used by the desktop compositor.
entries:
  # chicago.shell.display:patterns
  - name: patterns
    kind: library.lua
    meta:
      comment: The classic desktop patterns — 8×8 monochrome tiles as bit rows, the list of Display Properties, lookup by name.
    source: file://patterns.lua

  # chicago.shell.display:wallpapers
  - name: wallpapers
    kind: library.lua
    meta:
      comment: The shell's own wallpapers — names, files and the way each is meant to be shown (tile or center).
    source: file://wallpapers.lua

  # chicago.shell.display:wallpaper_files
  #
  # The wallpapers as PNG, drawn by tools/wallpapers.py: the shell's own
  # pixel art, MIT, shipped with the module (unlike assets/icons).
  - name: wallpaper_files
    kind: fs.directory
    meta:
      comment: The shell's own wallpapers as PNG — the pixel theme reads them as bytes through images.wallpaper.
    base: module
    directory: ./assets/wallpaper
    auto_init: false
