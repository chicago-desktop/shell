version: "1.0"
namespace: butschster.windows.antibug

# AntiBug (FR-009, docs/rfcs/009-antibug.md): the test scanner in the style of
# McAfee VirusScan 95. A scan is a run of test suites; an infected test is a
# failed case. The window runs the application's `meta.type: test` entries
# inside the running runtime, one at a time, without blocking the shell, and
# the targets the application declares (§4a) — module working copies through
# the wippy test runner, Go modules through `go test -json` — as children.
#
# Trust (§3, shape 1 — measured, test/src/antibug_actor_test.lua): a `funcs`
# call runs the callee under the actor its entry declares, with its declared
# policies added to the caller's scope. So the window keeps a narrow scope and
# calls `runner`, whose own actor carries the wide policy tests need; a test
# entry declares no actor of its own and runs under the runner, and so does
# the target process the runner spawns — the window itself never execs.

entries:
  # butschster.windows.antibug:process_host
  - name: process_host
    kind: ns.requirement
    meta:
      comment: The process host AntiBug's target processes run on.
    default: app:processes
    targets:
      - entry: butschster.windows.antibug:target
        path: .meta.process_host

  # butschster.windows.antibug:window_scope
  - name: window_scope
    kind: security.policy
    meta:
      comment: AntiBug's window — talk to the compositor and to its target process, find the test entries, the targets and the drives in the registry, write the log on a drive; nothing of the tests' own rights.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - registry.get
        - registry.find
        - fs.get
      resources: "*"
      effect: allow

  # butschster.windows.antibug:runner_call
  #
  # The one function the window may call. The user group's own `funcs.call`
  # covers kickside.* and the documentation function, not this entry, so no
  # other window reaches the runner.
  - name: runner_call
    kind: security.policy
    meta:
      comment: AntiBug's window may call AntiBug's runner through funcs, and nothing else.
    policy:
      actions:
        - funcs.call
      resources:
        - butschster.windows.antibug:runner
      effect: allow

  # butschster.windows.antibug:runner_policy
  - name: runner_policy
    kind: security.policy
    meta:
      comment: The runner's own scope — unrestricted, like the CLI test runner's (tests touch the database, fs and gfx; targets run through exec). The trust anchor of AntiBug; only its window may call the runner, and the runner runs only test entries and declared targets.
    policy:
      actions: "*"
      resources: "*"
      effect: allow

  # butschster.windows.antibug:exec
  #
  # exec.native does not inherit the OS environment, and there is no
  # `default_env` here: a `${env:HOME}` placeholder in this entry failed the
  # whole boot of the harness ("environment variable HOME not found for field
  # default_env.HOME") — a module must not take an application down for a
  # variable. The child's environment is its target declaration's `meta.env`.
  - name: exec
    kind: exec.native
    meta:
      comment: Runs AntiBug's scan targets — the wippy test runner of a module working copy, go test of a Go module — with the environment the target declares.

  # butschster.windows.antibug:scan
  - name: scan
    kind: library.lua
    meta:
      comment: AntiBug's model, pure — the test entries and targets, the group, suite and entry tree, what a selection scans, the scan's state machine over the wippy.test events, the findings, the log and the box.
    source: file://scan.lua

  # butschster.windows.antibug:targets
  - name: targets
    kind: library.lua
    meta:
      comment: AntiBug's scan targets, pure — the declarations, the command of each kind, and the parsers of the wippy runner's text and of go test -json into case events.
    source: file://targets.lua
    modules:
      - json

  # butschster.windows.antibug:runner
  - name: runner
    kind: function.lua
    meta:
      comment: Runs one scan item for AntiBug's window under its own actor and wide policy — a meta.type test entry, or a declared target through the target process; the events go to the window's pid.
    source: file://runner.lua
    method: run
    modules:
      - funcs
      - process
      - registry
    imports:
      targets: butschster.windows.antibug:targets
    security:
      actor:
        id: butschster.windows.antibug:runner
      policies:
        - butschster.windows.antibug:runner_policy

  # butschster.windows.antibug:target
  #
  # Spawned by the runner only (the window may not spawn): it inherits the
  # runner's actor, runs the target's command through `exec`, streams the
  # parsed cases to the window and kills the child on the window's Stop.
  - name: target
    kind: process.lua
    meta:
      comment: Runs one AntiBug scan target as a child through exec, parses its output into case events for the window, and kills it on Stop.
      process_host: app:processes
    source: file://target.lua
    method: main
    modules:
      - channel
      - exec
      - process
    imports:
      targets: butschster.windows.antibug:targets

  # butschster.windows.antibug:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: AntiBug
      # Runs builds and test suites on the server through its runner's broad
      # policy: only for a logged-on person whose scope grants windows.admin.
      requires: windows.admin
      # There is no antivirus picture in shell32; the magnifier of Find is
      # the closest — a scanner looks for something.
      image: find
      icon: "¤"
      group: Programs
      order: 60
      width: 64
      height: 22
      window_type: app
      resizable: true
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.antibug:window
      comment: AntiBug — runs the application's tests and the declared targets like a 1995 virus scan — Where and What, Reports, the findings, the progress and the Scan complete box; an SDK application.
    source: file://window.lua
    method: main
    modules:
      - channel
      - fs
      - funcs
      - process
      - registry
      - time
    security:
      policies:
        - butschster.windows.antibug:window_scope
        - butschster.windows.antibug:runner_call
    imports:
      app: butschster.windows.sdk:app
      ui: butschster.windows.sdk:ui
      filedialog: butschster.windows.sdk:filedialog
      scan: butschster.windows.antibug:scan
      targets: butschster.windows.antibug:targets
      sources: butschster.windows.explorer:sources
      explorer_model: butschster.windows.explorer:model
