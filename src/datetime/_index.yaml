version: "1.0"
namespace: butschster.windows.datetime

# «Свойства: Дата и время» в виде Windows 95, только для чтения — календарь,
# стрелочные часы, часовой пояс. Диалог на SDK оболочки: календарь и часы —
# компоненты SDK, своих раскладки, красок и поставщика у окна больше нет.

entries:
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Дата и время
      image: clock
      icon: "◷"
      group: Программы
      order: 30
      window_type: dialog
      resizable: false
      width: 44
      height: 22
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.datetime:window
      comment: Свойства даты и времени в виде Windows 95, только для чтения — календарь, стрелочные часы, часовой пояс; диалог на SDK оболочки.
    source: file://window.lua
    method: main
    modules:
      - time
    security:
      policies: [butschster.windows.security:view_state]
    imports:
      app: butschster.windows.sdk:app
      geometry: butschster.tui_desktop.desktop:geometry
