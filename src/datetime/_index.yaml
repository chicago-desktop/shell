version: "1.0"
namespace: butschster.windows.datetime

# "Date/Time Properties" in the Windows 95 look, read-only: a calendar, an
# analog clock, the time zone. A dialog on the shell SDK: the calendar and
# the clock are SDK components, the window no longer has its own layout,
# paint and provider.

entries:
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Date/Time
      image: clock
      icon: "◷"
      group: Programs
      order: 30
      window_type: dialog
      resizable: false
      width: 44
      height: 22
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.datetime:window
      comment: Date and time properties in the Windows 95 look, read-only — a calendar, an analog clock, the time zone; a dialog on the shell SDK.
    source: file://window.lua
    method: main
    modules:
      - time
    security:
      policies: [butschster.windows.security:view_state]
    imports:
      app: butschster.windows.sdk:app
      geometry: butschster.tui_desktop.desktop:geometry
