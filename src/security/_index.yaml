version: "1.0"
namespace: butschster.windows.security

# Permissions are split in two rather than merged into one "anything goes":
# the shell needs to spawn windows and run programs, the layout endpoints
# only need to read the registry and the database. An endpoint that can
# spawn processes will sooner or later do it as the wrong one.

entries:
  # butschster.windows.security:shell_runtime
  #
  # The shell's own permissions. The list repeats the base compositor's
  # permissions: the shell IS the compositor, called with its own theme, and
  # everything it does, it does under this actor.
  #
  # `registry.apply` is here, and it is not an oversight. Windows built by the
  # workshop are returned to the registry by the compositor itself — the
  # platform forbids background processes of the `wippy.security:process`
  # group from changing the registry, and a restorer service would silently
  # do nothing. A shell brought up on its own without this permission would
  # show a menu without the workshop windows and would not explain why they
  # are missing. The restore failure is visible in GET /windows/status.
  - name: shell_runtime
    kind: security.policy
    meta:
      comment: Shell permissions — spawn windows with a grant on the viewport, shut them down, run programs under a PTY, read the catalog from the registry and the layout from the database.
    policy:
      actions:
        - process.context
        - process.spawn
        - process.spawn.monitored
        - process.monitor
        - process.host
        - process.terminate
        - process.send
        - process.registry
        - process.registry.register
        - process.registry.unregister
        # Logon (butschster.windows.logon): windows are spawned under the
        # actor of the logged-on user — substituting a child's identity
        # requires a separate permission; the application's logon function
        # is called through funcs; the session token is turned into an actor
        # by the token store. The shell is NOT given access to the users
        # database for this: the password is checked by the application's
        # function under its own actor.
        - process.security
        - funcs.call
        - security.token_store.get
        - security.token.validate
        - exec.get
        - exec.run
        # The program catalog is read from the registry by meta.type — the
        # shell keeps no copy of the list of its own.
        - registry.get
        - registry.find
        - registry.entry
        - registry.apply
        # The layout is read and written at start (shortcuts for programs
        # with desktop true). Database access is checked as the action
        # `db.get` on the resource identifier, not as `sql.*` — verified on
        # the base.
        - db.get
        # Read the environment. The `env` module was declared on the entry,
        # but the action was not — and `env.get_all` silently returned an
        # EMPTY table, because it puts only permitted keys into it and does
        # not complain about the denial. That is, a person's request to turn
        # on pixel mode looked like "the person did not ask".
        #
        # A DECLARED MODULE WITHOUT A GRANTED PERMISSION LOOKS LIKE A MODULE
        # THAT HAS NOTHING TO SAY. This is not about env — it is about any
        # module in any policy here.
        - env.get
        # The pixel theme's font. It arrives as BYTES, not as a path: reading
        # a file is governed by the process's permissions, and a module that
        # opened paths by itself would be a road around them. Without this
        # permission pixel mode does not turn on and names the reason — the
        # shell then comes up in cells.
        - fs.get
      resources: "*"
      effect: allow

  # butschster.windows.security:shell_storage
  #
  # Permissions of the layout endpoints: read the catalog and read-write
  # their own rows. There is no process spawning and no program running here
  # — the endpoints move the layout, the shell opens the windows.
  - name: shell_storage
    kind: security.policy
    meta:
      comment: Permissions of the layout endpoints — reading the catalog from the registry and working with their own rows in the database.
    policy:
      actions:
        - process.context
        - registry.get
        - registry.find
        - registry.entry
        - db.get
        # The database resource is named by the environment
        # (BUTSCHSTER_WINDOWS_DB_ID), and without this permission the database
        # a person named would be silently replaced by the default:
        # `env.get_all` does not complain, it just does not put the key in.
        # It would be discovered by "the layout is not saved".
        - env.get
        # The compositor rereads the layout on command: the endpoint must
        # nudge it, otherwise the icon appears only after a restart.
        # Permissions for exactly that — find the addressee and send a
        # message; the endpoint still cannot spawn processes.
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # butschster.windows.security:explorer_window
  #
  # Permissions of the "My Computer" window. It can NOT spawn processes or run
  # programs — there is neither `spawn` nor `exec` here, and that is the main
  # thing in the list. The window can open a neighbouring window only by
  # asking the compositor, which decides by itself; a window with permission
  # to spawn processes will sooner or later launch something other than what
  # the file was opened with.
  #
  # `fs.get` — to show the contents of a drive. A drive here is a registry
  # entry, not a path on the machine, and it is opened precisely as an entry;
  # this permission gives no access to the machine past the registry.
  - name: explorer_window
    kind: security.policy
    meta:
      comment: Permissions of the "My Computer" window — read the registry, the layout and drive contents and ask the compositor to open a window; it cannot spawn processes or run programs.
    policy:
      actions:
        - process.context
        # Ask the compositor about open windows and ask it to open a new one.
        # Find the addressee and send a message — that is all; the answer
        # arrives in its own inbox and is handled by the window's own loop.
        - process.registry
        - process.send
        # The program catalog and the list of drives — both from the
        # registry, both read-only. `registry.apply` is absent here on
        # purpose.
        - registry.get
        - registry.find
        - registry.entry
        # The desktop layout. Database access is checked as the action
        # `db.get` on the resource identifier, not as `sql.*` — verified on
        # the base.
        - db.get
        # Drive contents.
        - fs.get
        # The database resource is named by the environment, and the `env`
        # module is declared on the entry. Without this permission
        # `env.get_all` silently returns an empty table — it puts only
        # permitted keys into it and does not complain about the denial.
        - env.get
      resources: "*"
      effect: allow

  # butschster.windows.security:shell_endpoint_access
  # State provider of a view window (FR-005 §4b): its own narrow actor,
  # separate from the compositor. It needs to read the context, find the
  # compositor by name and send it the state — and nothing more: no registry,
  # no database, no files. A provider that needs a drive declares its own
  # policy rather than extending this one: all views carry it, and a clock
  # must not be able to read files.
  - name: view_state
    kind: security.policy
    meta:
      comment: Permissions of a view window's state provider — process context, the compositor's name in the process registry, and sending it the state.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # Provider of the registry viewer: the same as a view, plus READING the
  # registry. `registry.apply` is not here and will not be (FR-004 §3.4): the
  # viewer changes nothing, and editing an entry is the business of the
  # control panel under its own actor.
  - name: regedit_state
    kind: security.policy
    meta:
      comment: Permissions of the registry viewer provider — context, sending to the compositor, and reading the registry; no writing to the registry, on purpose.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - registry.get
        - registry.find
        - registry.entry
      resources: "*"
      effect: allow

  - name: shell_endpoint_access
    kind: security.policy
    meta:
      comment: Authenticated users of the application may call the shell endpoints.
    groups: []
    policy:
      resources:
        - butschster.windows.api:*
      actions: access
      effect: allow

  # butschster.windows.security:user_security_scope
  - name: user_security_scope
    kind: ns.requirement
    meta:
      comment: The application security group that is given access to the shell endpoints.
    targets:
      - entry: butschster.windows.security:shell_endpoint_access
        path: ".groups +="
