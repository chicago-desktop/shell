version: "1.0"
namespace: windows.shell.sysprops

# "System Properties" is the properties window of "My Computer", like System
# Properties in Windows 95. It opens from the "Properties" item of the icon's
# context menu (`meta.properties` on the explorer entry) and from "Start →
# Settings".

entries:
  # windows.shell.sysprops:model
  - name: model
    kind: library.lua
    meta:
      comment: The pure model of "System Properties" — the stand's device tree from a runtime snapshot and registry entries, visible rows, captions.
    source: file://model.lua
    imports:
      geometry: windows.tui_desktop.desktop:geometry

  # Permissions: read the runtime and the registry, ask the compositor and
  # publish state to it. The window can neither write to the registry nor
  # spawn processes: it is a properties window, not a control panel.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Permissions of "System Properties" — read the runtime and the registry, publish state to the compositor; change nothing.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - system.read
        - registry.get
        - registry.find
      resources: "*"
      effect: allow

  # windows.shell.sysprops:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: "System Properties"
      image: system
      icon: "▥"
      group: Settings
      order: 130
      window_type: dialog
      resizable: false
      width: 60
      height: 24
      pixel_render: windows.shell.sdk:render
      pixel_state: windows.shell.sysprops:window
      comment: System Properties — the runtime node and modules, hosts, file systems, databases and HTTP from the registry, memory and goroutines; a window on the shell SDK, read-only.
    source: file://window.lua
    method: main
    modules:
      - system
      - registry
    security:
      policies: [windows.shell.sysprops:window_scope]
    imports:
      geometry: windows.tui_desktop.desktop:geometry
      app: windows.shell.sdk:app
      model: windows.shell.sysprops:model
      charts: windows.shell.sdk:charts
      facts: windows.shell.config:system
