version: "1.0"
namespace: butschster.windows.persist

# Storage for the desktop layout.
#
# There is no program code here: it lives in the base's
# butschster_tui_desktop_windows. Here there is only what the user moves —
# where an icon is and what it is called.

entries:
  # butschster.windows.persist:repo
  - name: repo
    kind: library.lua
    meta:
      comment: Desktop shortcuts and folders; deletion answers whether the row existed, and the mark of offered programs lives separately and is never deleted.
    source: file://repo.lua
    modules:
      # `registry` — the database is named by the migration entry's
      # meta.target_db (the module's target_db requirement), read with
      # registry.get; the calling process needs that right.
      - registry
      - sql
      - time
      - uuid
