version: "1.0"
namespace: windows.shell.run

# "Run" is a dialog on the shell SDK: a command field, "OK", "Cancel".
# It no longer has its own layout, renderer and editor: those come from
# `windows.shell.sdk`; the only thing of its own here is the launch
# spec.

entries:
  - name: model
    kind: library.lua
    meta:
      comment: The spec for launching a command through the base module's standard PTY window.
    source: file://model.lua

  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Run…
      image: run
      icon: "▸"
      order: 900
      # The root of "Start" explicitly: without group the program would go to "Programs".
      group: ""
      in_menu: true
      window_type: dialog
      resizable: false
      # After the Windows 95 reference: a 32 px icon, two hint lines at the
      # font's line step, a field, three buttons at the right edge. The client
      # is 48×7 cells: the hint in a 13 px font is 310 px, and a cell can be
      # 8 px (the owner's terminal), so in 41 cells the hint barely fits; in
      # 35 it was cut off with an ellipsis.
      width: 50
      height: 10
      pixel_render: windows.shell.sdk:render
      pixel_state: windows.shell.run:window
      comment: Enter a command and launch it in a separate Bash window through the compositor; a dialog on the shell SDK.
    source: file://window.lua
    method: main
    imports:
      app: windows.shell.sdk:app
      desktop: windows.tui_desktop.desktop:window_api
      model: windows.shell.run:model
    security:
      policies: [windows.shell.security:view_state]
