version: "1.0"
namespace: butschster.windows.viewers

# Viewers: Notepad for text and the image viewer.
#
# Both are opened from the explorer on a file, and both receive the file as
# one and the same argument — the string from `files.encode`. The difference
# is in how they are built: Notepad is a cell window that draws itself into
# its own viewport; the picture is a view window (`window_content: pixels`),
# drawn by the theme in the compositor process, while the data is brought by
# a separate provider with its own permissions. There is no way to show a
# picture in cells: placements travel only in the frame of the physical
# surface.
#
# The file-type registry lives here too: a program declares `meta.opens` —
# which extensions it opens — and the explorer assembles from the catalog a
# table "extension → entry". There is no separate table, and none is needed.

entries:
  # ─── Libraries ───────────────────────────────────────────────────────
  # butschster.windows.viewers:files
  - name: files
    kind: library.lua
    meta:
      comment: A file on a registry drive — the window argument as one string (JSON with drive and path), the extension, reading bytes through fs with a cap.
    source: file://files.lua
    modules:
      - fs
      - json

  # butschster.windows.viewers:associations
  - name: associations
    kind: library.lua
    meta:
      comment: File-type registry — a program declares meta.opens, the "extension → entry" table is assembled from the catalog; a dispute over an extension is named, not settled silently.
    source: file://associations.lua
    imports:
      files: butschster.windows.viewers:files

  # butschster.windows.viewers:picture_render
  #
  # Pure drawing of the view window: called by the theme in the compositor
  # process. It has no permissions and needs none — the picture arrives in
  # the window state.
  - name: picture_render
    kind: library.lua
    meta:
      comment: Image viewer, drawing — fit or show at a zoom, one frame raster per window, resent only on change.
    source: file://picture_render.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
    modules:
      - base64
      - gfx

  # ─── Permissions ─────────────────────────────────────────────────────
  # Viewer windows read a drive and nothing else: no registry, no database,
  # no processes. `fs.get` on `*` — because the drive can be any of the
  # registry's `fs.*` entries, and which one a person opens is not known in
  # advance.
  - name: viewer_scope
    kind: security.policy
    meta:
      comment: Viewer permissions — read a file from a registry drive. They cannot spawn processes or read the registry and the database.
    policy:
      actions:
        - process.context
        - fs.get
      resources: "*"
      effect: allow

  # The picture provider additionally needs to find the compositor and send
  # it the state.
  - name: provider_scope
    kind: security.policy
    meta:
      comment: State provider permissions — read a file from a drive and send the state to the compositor.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - fs.get
      resources: "*"
      effect: allow

  # ─── Notepad ─────────────────────────────────────────────────────────
  # butschster.windows.viewers:notepad
  - name: notepad
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Notepad
      # The program itself is a notepad with a pencil (w98_notepad); its files
      # in the explorer are a text document, as in Windows.
      image: notepad
      file_image: text_document
      icon: "▤"
      group: Programs
      order: 40
      width: 64
      height: 20
      # What it opens. The explorer assembles the type registry from this field.
      opens: [txt, md, log, csv, json, yaml, yml, lua, ini, conf, toml, xml, html, css, js, ts, go, py, sh]
      # The Type column of its files in the explorer's Details view.
      file_type: Text Document
      comment: Notepad — view a text file from a registry drive, read-only; lines do not wrap, scrolling with the arrows and the wheel.
    source: file://notepad.lua
    method: main
    modules:
      - channel
      - fs
      - json
      - tty
    security:
      policies: [butschster.windows.viewers:viewer_scope]
    imports:
      text: butschster.tui_desktop.desktop:text
      geometry: butschster.tui_desktop.desktop:geometry
      input: butschster.tui_desktop.desktop:input
      scroll: butschster.tui_desktop.desktop:scroll
      files: butschster.windows.viewers:files
      widgets: butschster.windows.shell:widgets

  # ─── Image viewer ────────────────────────────────────────────────────
  # butschster.windows.viewers:picture
  #
  # A view window. There is no process inside: the theme draws through
  # `render`, `state` brings the data. The source is a stub for the sake of
  # the entry's form.
  - name: picture
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Image Viewer
      # Useless in "Start": it is opened only by a file from the explorer.
      in_menu: false
      image: document
      icon: "▦"
      group: Programs
      order: 50
      width: 70
      height: 22
      window_content: pixels
      render: butschster.windows.viewers:picture_render
      state: butschster.windows.viewers:picture_state
      opens: [png, gif, jpg, jpeg]
      file_type: Image File
      comment: Image viewer — PNG, GIF, JPEG from a registry drive; fits into the window or shows at a zoom with panning. Pixel mode only.
    source: file://idle_window.lua
    method: main
    modules:
      - channel
      - time

  # butschster.windows.viewers:picture_state
  - name: picture_state
    kind: process.lua
    meta:
      comment: State provider for the image viewer — reads the file under its own permissions, sends the compositor the picture and the display mode, changes the mode on input.
    source: file://picture_state.lua
    method: main
    modules:
      - gfx
      - base64
      - channel
      - fs
      - json
      - process
    security:
      policies: [butschster.windows.viewers:provider_scope]
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      desktop: butschster.tui_desktop.desktop:window_api
      scroll: butschster.tui_desktop.desktop:scroll
      files: butschster.windows.viewers:files
