version: "1.0"
namespace: windows.shell.programs

# The program catalog and its only link to the layout.
#
# The registry declares what can be launched; the layout stores what lies
# where. They intersect in exactly one place — `desktop: true`, a program's
# request to put its shortcut on the desktop when it first appears. Beyond
# that the catalog knows nothing about the layout and must not know.

entries:
  # windows.shell.programs:catalog
  - name: catalog
    kind: library.lua
    meta:
      comment: The catalog from the registry — programs, menu folders, order. A registry failure and an empty catalog are returned as different values.
    source: file://catalog.lua
    modules:
      - registry
    imports:
      # The rules for `meta.in_menu` and `meta.window_type` are the base's
      # libraries, not our own. The base builds its own menu by them too; two
      # readings of the same meta drift apart silently, and one and the same
      # window would look like a dialog from "Start" and like an ordinary
      # window from the desktop.
      programs_meta: windows.tui_desktop.desktop:programs

  # windows.shell.programs:defaults
  - name: defaults
    kind: library.lua
    meta:
      comment: First-run desktop furniture — only what has something behind it; no prop icon is created here.
    source: file://defaults.lua
    modules:
      - registry
    imports:
      catalog: windows.shell.programs:catalog

  # windows.shell.programs:seed
  - name: seed
    kind: library.lua
    meta:
      comment: A shortcut for a program with desktop true — once for all time, even if the user deleted it.
    source: file://seed.lua
    modules:
      - sql
      - time
      - uuid
    imports:
      repo: windows.shell.persist:repo

  # windows.shell.programs:desktop_view
  - name: desktop_view
    kind: library.lua
    meta:
      comment: The layout joined with the catalog — the one place where a shortcut meets its registry entry, and the one rule for what a broken one looks like.
    source: file://desktop_view.lua
    modules:
      - registry
    imports:
      catalog: windows.shell.programs:catalog

  # windows.shell.programs:base_images
  #
  # Icons for the BASE's windows. The base knows no icons of its own — it has
  # no icon pack — and naming them in its entries would tie a public module to
  # names from this private one. So the shell declares them on its side with
  # the same entry type the application uses for workshop windows
  # (`windows.program_images`); a program's own `meta.image`, if present,
  # still takes precedence.
  - name: base_images
    kind: registry.entry
    meta:
      type: windows.program_images
      comment: Icons for the tui-desktop base windows — the Bash window gets the console.
    data:
      images:
        "windows.tui_desktop.desktop:window_pty": console
