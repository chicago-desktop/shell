version: "1.0"
namespace: chicago.shell.programs

# The program catalog and its only link to the layout.
#
# The registry declares what can be launched; the layout stores what lies
# where. They intersect in exactly one place — `desktop: true`, a program's
# request to put its shortcut on the desktop when it first appears. Beyond
# that the catalog knows nothing about the layout and must not know.

entries:
  # chicago.shell.programs:catalog
  - name: catalog
    kind: library.lua
    meta:
      comment: The catalog from the registry — programs, menu folders, order. A registry failure and an empty catalog are returned as different values.
    source: file://catalog.lua
    modules:
      - registry
    imports:
      # The rules for `meta.in_menu` and `meta.window_type` are the base's
      # libraries, not our own. The base builds its own menu by them too; two
      # readings of the same meta drift apart silently, and one and the same
      # window would look like a dialog from "Start" and like an ordinary
      # window from the desktop.
      programs_meta: chicago.tui_desktop.desktop:programs

  # chicago.shell.programs:defaults
  - name: defaults
    kind: library.lua
    meta:
      comment: First-run desktop furniture — only what has something behind it; no prop icon is created here.
    source: file://defaults.lua
    modules:
      - registry
    imports:
      catalog: chicago.shell.programs:catalog

  # chicago.shell.programs:seed
  - name: seed
    kind: library.lua
    meta:
      comment: A shortcut for a program with desktop true — once for all time, even if the user deleted it.
    source: file://seed.lua
    modules:
      - sql
      - time
      - uuid
    imports:
      repo: chicago.shell.persist:repo

  # chicago.shell.programs:desktop_view
  - name: desktop_view
    kind: library.lua
    meta:
      comment: The layout joined with the catalog — the one place where a shortcut meets its registry entry, and the one rule for what a broken one looks like.
    source: file://desktop_view.lua
    modules:
      - registry
    imports:
      catalog: chicago.shell.programs:catalog

  # chicago.shell.programs:base_images
  #
  # Icons for the BASE's windows. The base knows no icons of its own — it has
  # no icon pack — and naming them in its entries would tie a public module to
  # names from this private one. So the shell declares them on its side with
  # the same entry type the application uses for workshop windows
  # (`chicago.program_images`); a program's own `meta.image`, if present,
  # still takes precedence.
  - name: base_images
    kind: registry.entry
    meta:
      type: chicago.program_images
      comment: Icons for the tui-desktop base windows — the Bash window gets the console.
    data:
      images:
        "chicago.tui_desktop.desktop:window_pty": console

  # chicago.shell.programs:startup
  #
  # Startup windows — `meta.type: chicago.startup` registry entries naming a
  # window (`data.entry`), its `data.args` and an optional `data.when`
  # function. Read, checked and opened after a successful logon, never on a
  # desktop without one (docs/sdk.md, "Startup windows").
  - name: startup
    kind: library.lua
    meta:
      comment: Startup windows after logon — the chicago.startup entries in meta.order, a when function asked through funcs with the user id, and every skip named in the log.
    source: file://startup.lua
    modules:
      - channel
      - funcs
      - logger
      - process
      - registry
      - time
    imports:
      catalog: chicago.shell.programs:catalog
      window_api: chicago.tui_desktop.desktop:window_api

  # chicago.shell.programs:startup_run
  #
  # The process the logon wrapper spawns with the compositor's pid and the
  # user id. The wrapper runs inside the compositor, which cannot send itself
  # `desktop.open` — its refusal would be answered to itself for ever — so
  # this asks from outside, as any window does, and ends. It runs under the
  # compositor's actor (spawned without a substitute), with the permissions
  # the catalog and the logon already use — registry.get and registry.find,
  # funcs.call, process.send.
  - name: startup_run
    kind: process.lua
    meta:
      comment: Opens the logged-on person's startup windows through the compositor, in order, and ends.
    source: file://startup_run.lua
    method: main
    modules:
      - channel
      - funcs
      - logger
      - process
      - registry
      - time
    imports:
      startup: chicago.shell.programs:startup

  - name: desktop_menu
    kind: library.lua
    source: file://desktop_menu.lua
    modules: [registry]
    meta: {comment: "Desktop context-menu contributions from chicago.desktop_menu registry entries."}
