version: "1.0"
namespace: butschster.windows.explorer

# "My Computer" — a window that shows the running system itself.
#
# Drives come from the registry. `fs.directory` and `fs.embed` entries are
# brought by almost every installed module, and there is no need to create
# them — only to show them. Hence both rules at once. A drive declared by an
# installed module appears by itself, with no edit in the shell. A drive that
# is not in the registry will not be here — a painted C: would be an object
# that does not exist, and the first question would be why it does not open.
#
# The window does not read other modules' tables. Runs, bridge jobs and
# content-machine beats belong to modules the shell does not depend on; were
# it to read their schemas directly, it would break on their first migration,
# silently and not in its own code. A module that wants to show its own data
# declares a window as an entry with `meta.type` equal to
# `tui_desktop.window`, and it appears in "Programs" by itself.
#
# THE TRAP OF THIS FILE. A colon followed by a space inside an unquoted value
# is read by YAML as the start of a new pair, and the failure comes from the
# entry loader pointing at the file, not at the phrase.

entries:
  # butschster.windows.explorer:model
  - name: model
    kind: library.lua
    meta:
      comment: The objects of "My Computer" — a pure assembly from what was read, without a single call to the database or the registry.
    source: file://model.lua
    modules:
      - registry
    imports:
      # File type registry: the program for an extension and its icon.
      associations: butschster.windows.viewers:associations
      catalog: butschster.windows.programs:catalog
      # The extension rule for the Type column of an unknown file.
      files: butschster.windows.viewers:files

  # butschster.windows.explorer:sources
  - name: sources
    kind: library.lua
    meta:
      comment: Reading the sources for "My Computer"; the list of open windows is brought by the window process itself, not by this library.
    source: file://sources.lua
    modules:
      # `fs` — to read a drive's contents by a registry entry, not by a path
      # on the machine. What exactly gets opened is decided by the window's
      # policy, not by this list.
      - fs
      - registry
      - sql
      - time
      - uuid
    imports:
      catalog: butschster.windows.programs:catalog
      model: butschster.windows.explorer:model
      repo: butschster.windows.persist:repo

  # butschster.windows.explorer:render
  #
  # The look of the window contents is separate from the window process —
  # along the same boundary that separates the theme from the compositor:
  # only strings and arithmetic here. That is why a frame can be viewed with
  # the `tools/themeprobe` probe without starting either the window or the
  # runtime, and a full-screen program cannot be checked any other way.
  - name: render
    kind: library.lua
    meta:
      comment: The contents of "My Computer" — menu bar, toolbar, icon field and status bar; the hits are returned by the same function that draws.
    source: file://render.lua
    modules:
      - tty
    imports:
      scroll: butschster.tui_desktop.desktop:scroll
      icons: butschster.windows.shell:icons
      widgets: butschster.windows.shell:widgets

  # butschster.windows.explorer:render_pixels
  #
  # The second backend of the same view. A separate entry, not a branch
  # inside `render`, because `render` must load where the `gfx` module does
  # not exist at all: the shell has to work in a plain xterm, and the cell
  # path has no right to die together with graphics. An entry that declared
  # `gfx` does not load on such a runtime — not "without pixels", but
  # entirely.
  #
  # Rule: `gfx` is declared only by whoever does not exist without it.
  - name: render_pixels
    kind: library.lua
    meta:
      comment: Pixel painting for "My Computer" — takes the layout and hits ready-made from render, rasters from the store; the frame is sliced by rows so that selecting an icon does not repaint the menu.
    source: file://render_pixels.lua
    modules:
      - gfx
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      scroll: butschster.tui_desktop.desktop:scroll
      palette: butschster.windows.shell:palette
      pixels: butschster.windows.shell:pixels

  # butschster.windows.explorer:window
  #
  # The window itself. An ordinary registry program — the shell finds it with
  # the same `registry.find` as everything else, and it gets into the "Start"
  # menu without a single edit in the catalog.
  #
  # The modules are listed as a union: both those the window itself needs and
  # those its libraries need. The permission, not the module list, decides
  # what the window can access — the policy below lets it read and ask, but
  # not spawn.
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: My Computer
      image: my_computer
      pixel_render: butschster.windows.explorer:render_pixels
      pixel_state: butschster.windows.explorer:state
      icon: "▣"
      # The number of icons that fit in a row is the width minus two cells,
      # divided by the grid step of twelve. Sixty-four is five columns, that
      # is, a row of drives rather than a column.
      # The Windows 95 toolbar is thirteen buttons and four separators, 69
      # cells; in 64 "List", "Details" and "Refresh" did not fit.
      width: 72
      height: 22
      # NOT shown in "Start" — owner's decision 2026-09-09: "My Computer" is
      # opened from the desktop, as in Windows, and a shortcut to a hidden
      # program works (`in_menu` is about the menu, not about launching).
      # `group: ""` is kept in case it is brought back: then it will go to
      # the root, at the top.
      in_menu: false
      order: 5
      group: ""
      # "Properties" in the icon's context menu is "System Properties".
      properties: butschster.windows.sysprops:window
      comment: The "My Computer" window — the filesystems from the registry and their contents; a shared controller for the cell mode and the pixel view.
    source: file://window.lua
    method: main
    modules:
      - channel
      - fs
      - json
      - registry
      - sql
      - time
      - tty
      - uuid
    security:
      policies: [butschster.windows.security:explorer_window]
    imports:
      scrolling: butschster.tui_desktop.desktop:scroll
      geometry: butschster.tui_desktop.desktop:geometry
      # Requests to the compositor go through the base library, not our own
      # protocol. It reads the compositor's name from the process context; a
      # constant of our own would work only under our shell and would
      # silently miss under any other.
      desktop: butschster.tui_desktop.desktop:window_api
      model: butschster.windows.explorer:model
      render: butschster.windows.explorer:render
      sources: butschster.windows.explorer:sources

  - name: state
    kind: process.lua
    meta:
      comment: State of the pixel explorer; the same controller and permissions as the cell window.
    source: file://window.lua
    method: main
    modules:
      - channel
      - fs
      - json
      - registry
      - sql
      - time
      - tty
      - uuid
    security:
      policies: [butschster.windows.security:explorer_window]
    imports:
      scrolling: butschster.tui_desktop.desktop:scroll
      geometry: butschster.tui_desktop.desktop:geometry
      # Requests to the compositor go through the base library, not our own
      # protocol. It reads the compositor's name from the process context; a
      # constant of our own would work only under our shell and would
      # silently miss under any other.
      desktop: butschster.tui_desktop.desktop:window_api
      model: butschster.windows.explorer:model
      render: butschster.windows.explorer:render
      sources: butschster.windows.explorer:sources
