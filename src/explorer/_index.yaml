version: "1.0"
namespace: butschster.windows.explorer

# «Мой компьютер» — окно, показывающее сам стенд.
#
# Диски приходят из реестра. Записи `fs.directory` и `fs.embed` привозит почти
# каждый установленный модуль, и заводить их не надо — надо показать. Отсюда
# оба правила разом. Диск, объявленный установленным модулем, появляется сам,
# без правки в оболочке. Диска, которого в реестре нет, здесь не будет —
# нарисованный C: был бы предметом, которого не существует, и первым вопросом
# было бы, почему он не открывается.
#
# Чужих таблиц окно не читает. Прогоны, работы бриджа и биты контент-машины
# принадлежат модулям, от которых оболочка не зависит; прочитай она их схемы
# напрямую — сломалась бы на их первой миграции, молча и не у себя. Модуль,
# желающий показать своё, объявляет окно записью с `meta.type` равным
# `tui_desktop.window`, и оно появляется в «Программах» само.
#
# ЛОВУШКА ЭТОГО ФАЙЛА. Двоеточие с пробелом внутри незакавыченного значения
# YAML читает как начало новой пары, и отказ приходит от загрузчика записей с
# указанием на файл, а не на фразу.

entries:
  # butschster.windows.explorer:model
  - name: model
    kind: library.lua
    meta:
      comment: Объекты «Моего компьютера» — чистая сборка из прочитанного, без единого обращения в базу и реестр.
    source: file://model.lua
    modules:
      - registry
    imports:
      # Реестр типов файлов: программа для расширения и её значок.
      associations: butschster.windows.viewers:associations
      catalog: butschster.windows.programs:catalog

  # butschster.windows.explorer:sources
  - name: sources
    kind: library.lua
    meta:
      comment: Чтение источников для «Моего компьютера»; список открытых окон приносит сам процесс окна, а не эта библиотека.
    source: file://sources.lua
    modules:
      # `fs` — чтобы прочитать содержимое диска записью реестра, а не путём
      # на машине. Что именно открывается, решает политика окна, а не этот
      # список.
      - fs
      - registry
      - sql
      - env
      - time
      - uuid
    imports:
      catalog: butschster.windows.programs:catalog
      model: butschster.windows.explorer:model
      repo: butschster.windows.persist:repo

  # butschster.windows.explorer:render
  #
  # Вид содержимого окна отдельно от процесса окна — по той же границе, по
  # которой тема отделена от композитора: здесь только строки и арифметика.
  # Поэтому кадр смотрится пробником `tools/themeprobe`, не поднимая ни окна,
  # ни стенда, а полноэкранную программу иначе не проверить вовсе.
  - name: render
    kind: library.lua
    meta:
      comment: Содержимое «Моего компьютера» — строка меню, панель инструментов, поле значков и статусная строка; попадания возвращает та же функция, что рисует.
    source: file://render.lua
    modules:
      - tty
    imports:
      scroll: butschster.tui_desktop.desktop:scroll
      icons: butschster.windows.shell:icons
      widgets: butschster.windows.shell:widgets

  # butschster.windows.explorer:render_pixels
  #
  # Второй бэкенд того же вида. Отдельной записью, а не веткой внутри
  # `render`, потому что `render` обязан грузиться там, где модуля `gfx` нет
  # вовсе: оболочка должна работать в обычном xterm, и путь в ячейках не имеет
  # права умирать вместе с графикой. Запись, объявившая `gfx`, на таком
  # рантайме не грузится — не «без пикселей», а целиком.
  #
  # Правило: `gfx` объявляет только тот, кто без него не существует.
  - name: render_pixels
    kind: library.lua
    meta:
      comment: Пиксельные краски «Моего компьютера» — раскладку и попадания берёт готовыми у render, растры у хранилища; кадр нарезан по строкам, чтобы выделение значка не перерисовывало меню.
    source: file://render_pixels.lua
    modules:
      - gfx
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      scroll: butschster.tui_desktop.desktop:scroll
      palette: butschster.windows.shell:palette
      pixels: butschster.windows.shell:pixels

  # butschster.windows.explorer:window
  #
  # Само окно. Обычная программа реестра — оболочка находит его тем же
  # `registry.find`, что и всё остальное, и в меню «Пуск» оно попадает без
  # единой правки в каталоге.
  #
  # Модули перечислены объединением: и те, что нужны самому окну, и те, что
  # нужны его библиотекам. Право, а не список модулей, решает, что окну
  # доступно, — политика ниже даёт читать и просить, но не порождать.
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Мой компьютер
      image: my_computer
      pixel_render: butschster.windows.explorer:render_pixels
      pixel_state: butschster.windows.explorer:state
      icon: "▣"
      # Значков в ряд помещается ширина минус две ячейки, делённая на шаг
      # сетки в двенадцать. Шестьдесят четыре — это пять колонок, то есть
      # ряд дисков, а не колонка.
      # Панель Windows 95 — тринадцать кнопок и четыре разделителя, 69 ячеек;
      # в 64 не помещались «Список», «Таблица» и «Обновить».
      width: 72
      height: 22
      # Корень «Пуска», самый верх, и разделитель под ним — как в Windows.
      order: 5
      group: ""
      separator_after: true
      # «Свойства» в контекстном меню значка — «Свойства: Система».
      properties: butschster.windows.sysprops:window
      comment: Окно «Мой компьютер» — файловые системы из реестра и их содержимое; общий контроллер для режима ячеек и пиксельного вида.
    source: file://window.lua
    method: main
    modules:
      - channel
      - env
      - fs
      - json
      - registry
      - sql
      - time
      - tty
      - uuid
    security:
      policies: [butschster.windows.security:explorer_window]
    imports:
      scrolling: butschster.tui_desktop.desktop:scroll
      geometry: butschster.tui_desktop.desktop:geometry
      # Просьбы к композитору — библиотекой основы, а не своим протоколом.
      # Имя композитора она читает из контекста процесса; своя константа
      # работала бы только под нашей оболочкой и молча промахивалась бы под
      # любой другой.
      desktop: butschster.tui_desktop.desktop:window_api
      model: butschster.windows.explorer:model
      render: butschster.windows.explorer:render
      sources: butschster.windows.explorer:sources

  - name: state
    kind: process.lua
    meta:
      comment: Состояние пиксельного проводника; тот же контроллер и права, что у окна в ячейках.
    source: file://window.lua
    method: main
    modules:
      - channel
      - env
      - fs
      - json
      - registry
      - sql
      - time
      - tty
      - uuid
    security:
      policies: [butschster.windows.security:explorer_window]
    imports:
      scrolling: butschster.tui_desktop.desktop:scroll
      geometry: butschster.tui_desktop.desktop:geometry
      # Просьбы к композитору — библиотекой основы, а не своим протоколом.
      # Имя композитора она читает из контекста процесса; своя константа
      # работала бы только под нашей оболочкой и молча промахивалась бы под
      # любой другой.
      desktop: butschster.tui_desktop.desktop:window_api
      model: butschster.windows.explorer:model
      render: butschster.windows.explorer:render
      sources: butschster.windows.explorer:sources
