version: "1.0"
namespace: butschster.windows.explorer

# «Мой компьютер» — окно, показывающее сам стенд.
#
# Дисков здесь нет, потому что их нет и на стенде: нарисованный диск C: — это
# предмет, которого не существует, и первым вопросом было бы, почему он не
# открывается.
#
# Чужих таблиц окно не читает. Прогоны, работы бриджа и биты контент-машины
# принадлежат модулям, от которых оболочка не зависит; прочитай она их схемы
# напрямую — сломалась бы на их первой миграции, молча и не у себя. Модуль,
# желающий показать своё, объявляет окно записью с `meta.type:
# tui_desktop.window`, и оно появляется в «Программах» само.

entries:
  # butschster.windows.explorer:model
  - name: model
    kind: library.lua
    meta:
      comment: Объекты «Моего компьютера» — чистая сборка из прочитанного, без единого обращения в базу и реестр.
    source: file://model.lua
    modules:
      - registry
    imports:
      catalog: butschster.windows.programs:catalog

  # butschster.windows.explorer:sources
  - name: sources
    kind: library.lua
    meta:
      comment: Чтение источников для «Моего компьютера»; список открытых окон приносит сам процесс окна, а не эта библиотека.
    source: file://sources.lua
    modules:
      - registry
      - sql
      - env
      - time
      - uuid
    imports:
      catalog: butschster.windows.programs:catalog
      model: butschster.windows.explorer:model
      repo: butschster.windows.persist:repo
