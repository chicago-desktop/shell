version: "1.0"
namespace: butschster.windows.calc

# Калькулятор Windows 95 в обычном виде. Арифметика — `engine`, чистая и без
# экрана; окно собрано на SDK оболочки, поэтому считает и в ячейках, и в
# пикселях, а собственных раскладки и красок у него больше нет.

entries:
  - name: engine
    kind: library.lua
    meta:
      comment: Арифметика калькулятора — настольная, операция применяется сразу; табло с точкой у целого, отказы фразой; клавиши в те же кнопки, что и мышь.
    source: file://engine.lua

  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Калькулятор
      image: calculator
      icon: "▦"
      group: Программы
      order: 20
      window_type: app
      resizable: false
      width: 29
      height: 16
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.calc:window
      comment: Калькулятор в виде Windows 95 — обычный вид с памятью, считает как настольный; окно на SDK оболочки.
    source: file://window.lua
    method: main
    modules: [time]
    security:
      policies: [butschster.windows.security:view_state]
    imports:
      app: butschster.windows.sdk:app
      engine: butschster.windows.calc:engine
