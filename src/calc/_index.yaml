version: "1.0"
namespace: windows.shell.calc

# The Windows 95 calculator in standard view. The arithmetic is `engine`,
# pure and with no screen; the window is built on the shell SDK, so it
# computes both in cells and in pixels, and it no longer has its own layout
# and paint.

entries:
  - name: engine
    kind: library.lua
    meta:
      comment: Calculator arithmetic — desktop-style, an operation applies immediately; the display puts a dot after an integer, failures are phrases; keys map to the same buttons as the mouse.
    source: file://engine.lua

  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Calculator
      image: calculator
      icon: "▦"
      group: Programs
      order: 20
      window_type: app
      resizable: false
      width: 29
      height: 16
      pixel_render: windows.shell.sdk:render
      pixel_state: windows.shell.calc:window
      comment: Calculator in the Windows 95 look — standard view with memory, computes like a desktop calculator; a window on the shell SDK.
    source: file://window.lua
    method: main
    security:
      policies: [windows.shell.security:view_state]
    imports:
      app: windows.shell.sdk:app
      ui: windows.shell.sdk:ui
      engine: windows.shell.calc:engine
