version: "1.0"
namespace: butschster.windows.taskman

# Диспетчер задач — окно на SDK оболочки, показывающее сам рантайм: открытые
# окна, процессы, память и горутины во времени, узел и кластер.
#
# Цифры снимает окно само, модулем `system`, под своими правами. Загрузки
# процессора в процентах нет нарочно — рантайм её не считает, а читать
# `/proc` окну нельзя. Честная нагрузка рантайма — горутины и куча.

entries:
  # butschster.windows.taskman:model
  - name: model
    kind: library.lua
    meta:
      comment: Диспетчер задач, чистая модель — история измерений, форматы, устойчивая сортировка процессов; график и потолок берёт у SDK.
    source: file://model.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      charts: butschster.windows.sdk:charts

  # Права: читать рантайм (`system.read` — хосты, узел, кластер), спросить
  # композитор про открытые окна и опубликовать ему состояние. Ни порождать,
  # ни гасить чужие процессы окно не может — «Снять задачу» здесь нет.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Права диспетчера задач — прочитать состояние рантайма и спросить композитор; ничего не запускать и не гасить.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - system.read
      resources: "*"
      effect: allow

  # butschster.windows.taskman:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Task Manager
      image: taskmgr
      icon: "▥"
      group: Settings
      order: 120
      window_type: app
      resizable: true
      width: 78
      height: 27
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.taskman:window
      comment: Диспетчер задач — открытые окна, процессы рантайма, память и горутины во времени, узел; обновляется раз в секунду; окно на SDK оболочки.
    source: file://window.lua
    method: main
    modules:
      - os
      - system
    security:
      policies: [butschster.windows.taskman:window_scope]
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      app: butschster.windows.sdk:app
      desktop: butschster.tui_desktop.desktop:window_api
      model: butschster.windows.taskman:model
      charts: butschster.windows.sdk:charts
      facts: butschster.windows.config:system
