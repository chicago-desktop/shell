version: "1.0"
namespace: butschster.windows.taskman

# Task Manager: a window on the shell SDK that shows the runtime itself: open
# windows, processes, memory and goroutines over time, the node and the
# cluster.
#
# The window takes the numbers itself, with the `system` module, under its
# own permissions. There is no CPU load in percent on purpose: the runtime
# does not compute it, and the window is not allowed to read `/proc`. The
# honest load of the runtime is goroutines and the heap.

entries:
  # butschster.windows.taskman:model
  - name: model
    kind: library.lua
    meta:
      comment: Task Manager, pure model — measurement history, formats, stable process sorting; the graph and the ceiling come from the SDK.
    source: file://model.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      charts: butschster.windows.sdk:charts

  # Permissions: read the runtime (`system.read`: hosts, node, cluster), ask
  # the compositor about open windows and publish its state to it. The window
  # can neither spawn nor kill other processes: there is no "End Task" here.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Task Manager permissions — read the runtime state and ask the compositor; start nothing and kill nothing.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - system.read
      resources: "*"
      effect: allow

  # butschster.windows.taskman:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Task Manager
      image: taskmgr
      icon: "▥"
      group: Settings
      order: 120
      window_type: app
      resizable: true
      width: 78
      height: 27
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.taskman:window
      comment: Task Manager — open windows, runtime processes, memory and goroutines over time, the node; refreshes once a second; a window on the shell SDK.
    source: file://window.lua
    method: main
    modules:
      - os
      - system
    security:
      policies: [butschster.windows.taskman:window_scope]
    imports:
      geometry: butschster.tui_desktop.desktop:geometry
      app: butschster.windows.sdk:app
      desktop: butschster.tui_desktop.desktop:window_api
      model: butschster.windows.taskman:model
      charts: butschster.windows.sdk:charts
      facts: butschster.windows.config:system
