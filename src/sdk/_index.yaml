version: "1.0"
namespace: windows.shell.sdk

entries:
  - name: ui
    kind: library.lua
    meta: {comment: "Window SDK ui. See docs/sdk.md."}
    source: file://ui.lua
    imports:
      text: windows.tui_desktop.desktop:text
      geometry: windows.tui_desktop.desktop:geometry
      editor: windows.shell.sdk:editor
      scroll: windows.tui_desktop.desktop:scroll
      input: windows.tui_desktop.desktop:input

  - name: charts
    kind: library.lua
    meta: {comment: "Window SDK charts: block-glyph graph and round ceilings. See docs/sdk.md."}
    source: file://charts.lua
    imports:
      geometry: windows.tui_desktop.desktop:geometry

  - name: gadget
    kind: library.lua
    meta: {comment: "Window SDK gadget kit. Plain trees for desktop widgets (stat, meter, history, lines, stack). See docs/sdk.md."}
    source: file://gadget.lua
    imports:
      charts: windows.shell.sdk:charts
      text: windows.tui_desktop.desktop:text

  - name: filedialog
    kind: library.lua
    meta: {comment: "Window SDK file dialog. The Windows 95 Open / Save As sheet, pure: the application reads the places it asks for. See docs/sdk.md."}
    source: file://filedialog.lua
    imports:
      files: windows.shell.viewers:files

  - name: cells
    kind: library.lua
    meta: {comment: "Window SDK cells. See docs/sdk.md."}
    source: file://cells.lua
    modules: [tty]
    imports:
      text: windows.tui_desktop.desktop:text
      ui: windows.shell.sdk:ui
      charts: windows.shell.sdk:charts
      geometry: windows.tui_desktop.desktop:geometry
      editor: windows.shell.sdk:editor
      widgets: windows.shell.theme:widgets
      icons: windows.shell.theme:icons
      palette: windows.shell.theme:palette
      glyphs: windows.shell.theme:glyphs

  - name: render
    kind: library.lua
    meta: {comment: "Window SDK render. See docs/sdk.md."}
    source: file://render.lua
    modules: [gfx]
    imports:
      text: windows.tui_desktop.desktop:text
      ui: windows.shell.sdk:ui
      charts: windows.shell.sdk:charts
      geometry: windows.tui_desktop.desktop:geometry
      editor: windows.shell.sdk:editor
      pixels: windows.shell.theme:pixels
      images: windows.shell.theme:images
      palette: windows.shell.theme:palette
      widgets: windows.shell.theme:widgets

  - name: app
    kind: library.lua
    meta: {comment: "Window SDK app. See docs/sdk.md."}
    source: file://app.lua
    modules: [channel, tty, time]
    imports:
      desktop: windows.tui_desktop.desktop:window_api
      ui: windows.shell.sdk:ui
      cells: windows.shell.sdk:cells
      widgets: windows.shell.theme:widgets
      editor: windows.shell.sdk:editor

  - name: editor
    kind: library.lua
    meta: {comment: "UTF-8 input editing for SDK controls: the single-line field and the multi-line editor's document (keys, selection, one-level undo, find, word wrap). See docs/sdk.md."}
    source: file://editor.lua
    imports:
      geometry: windows.tui_desktop.desktop:geometry
      text: windows.tui_desktop.desktop:text
