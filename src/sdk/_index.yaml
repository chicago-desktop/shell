version: "1.0"
namespace: chicago.shell.sdk

entries:
  - name: ui
    kind: library.lua
    meta: {comment: "Window SDK ui. See docs/sdk.md."}
    source: file://ui.lua
    imports:
      text: chicago.tui_desktop.desktop:text
      geometry: chicago.tui_desktop.desktop:geometry
      editor: chicago.shell.sdk:editor
      scroll: chicago.tui_desktop.desktop:scroll
      input: chicago.tui_desktop.desktop:input

  - name: charts
    kind: library.lua
    meta: {comment: "Window SDK charts: block-glyph graph and round ceilings. See docs/sdk.md."}
    source: file://charts.lua
    imports:
      geometry: chicago.tui_desktop.desktop:geometry

  - name: gadget
    kind: library.lua
    meta: {comment: "Window SDK gadget kit. Plain trees for desktop widgets (stat, meter, history, lines, stack). See docs/sdk.md."}
    source: file://gadget.lua
    imports:
      charts: chicago.shell.sdk:charts
      text: chicago.tui_desktop.desktop:text

  - name: filedialog
    kind: library.lua
    meta: {comment: "Window SDK file dialog. The classic Open / Save As sheet, pure: the application reads the places it asks for. See docs/sdk.md."}
    source: file://filedialog.lua
    imports:
      files: chicago.shell.viewers:files

  - name: cells
    kind: library.lua
    meta: {comment: "Window SDK cells. See docs/sdk.md."}
    source: file://cells.lua
    modules: [tty]
    imports:
      text: chicago.tui_desktop.desktop:text
      ui: chicago.shell.sdk:ui
      charts: chicago.shell.sdk:charts
      geometry: chicago.tui_desktop.desktop:geometry
      editor: chicago.shell.sdk:editor
      widgets: chicago.shell.theme:widgets
      icons: chicago.shell.theme:icons
      palette: chicago.shell.theme:palette
      glyphs: chicago.shell.theme:glyphs

  - name: render
    kind: library.lua
    meta: {comment: "Window SDK render. See docs/sdk.md."}
    source: file://render.lua
    modules: [gfx]
    imports:
      text: chicago.tui_desktop.desktop:text
      ui: chicago.shell.sdk:ui
      charts: chicago.shell.sdk:charts
      geometry: chicago.tui_desktop.desktop:geometry
      editor: chicago.shell.sdk:editor
      pixels: chicago.shell.theme:pixels
      images: chicago.shell.theme:images
      palette: chicago.shell.theme:palette
      widgets: chicago.shell.theme:widgets

  - name: app
    kind: library.lua
    meta: {comment: "Window SDK app. See docs/sdk.md."}
    source: file://app.lua
    modules: [channel, tty, time]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api
      ui: chicago.shell.sdk:ui
      cells: chicago.shell.sdk:cells
      widgets: chicago.shell.theme:widgets
      editor: chicago.shell.sdk:editor

  - name: editor
    kind: library.lua
    meta: {comment: "UTF-8 input editing for SDK controls: the single-line field and the multi-line editor's document (keys, selection, one-level undo, find, word wrap). See docs/sdk.md."}
    source: file://editor.lua
    imports:
      geometry: chicago.tui_desktop.desktop:geometry
      text: chicago.tui_desktop.desktop:text

  - name: format
    kind: library.lua
    meta: {comment: "Time, names and refusal text for windows: RFC3339 and SQLite datetime parsing, local formatting from the clock's offset, the name a person is shown by, a refusal's wording by its error kind; pure. See docs/sdk.md."}
    source: file://format.lua
