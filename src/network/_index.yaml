version: "1.0"
namespace: butschster.windows.network

# Network Neighborhood — the Wippy mesh seen from inside the shell: which
# nodes gossip currently shows, which one this runtime is, and which one Raft
# elected. Read-only: the window joins nothing and evicts nobody.
#
# A single-node runtime is a normal picture here, not an empty one — the local
# node is always in the list, and the status bar says "standalone node".

entries:
  # butschster.windows.network:model
  - name: model
    kind: library.lua
    meta:
      comment: The pure model of Network Neighborhood — a membership snapshot into table rows, roles, captions and the status line.
    source: file://model.lua

  # Permissions: read the node and the membership and publish state to the
  # compositor. `system.read` is checked BY NAME per resource, so all three
  # names are listed: a policy with only `cluster` would leave `node`
  # answering "permission denied", and from outside that is
  # indistinguishable from "there is no cluster".
  - name: window_scope
    kind: security.policy
    meta:
      comment: Permissions of Network Neighborhood — read the node, the membership and raft, publish state to the compositor; change nothing.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - system.read
      resources: "*"
      effect: allow

  # butschster.windows.network:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Network Neighborhood
      image: network_neighborhood
      icon: "▩"
      # Settings, not "Programs": the window shows how the system is built,
      # like "Registry" and "Task Manager", and stands in the same row.
      group: Settings
      order: 40
      # The program's own request to put a shortcut on the desktop at the
      # first start: in Windows 95 "Network Neighborhood" lived on the
      # desktop, not in the menu. The mark that it was offered is not
      # cleared: a discarded icon does not come back.
      desktop: true
      window_type: app
      resizable: true
      width: 64
      height: 18
      pixel_render: butschster.windows.sdk:render
      pixel_state: butschster.windows.network:window
      comment: Network Neighborhood — mesh nodes, their addresses, role and leader; refreshes every two seconds, read-only.
    source: file://window.lua
    method: main
    modules:
      - system
    security:
      policies: [butschster.windows.network:window_scope]
    imports:
      app: butschster.windows.sdk:app
      ui: butschster.windows.sdk:ui
      model: butschster.windows.network:model
      facts: butschster.windows.config:system
