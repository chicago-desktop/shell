version: "1.0"
namespace: butschster.windows.config

# What the application told the module through the environment — the names
# of the database, fonts, logon function, declarations folder.
#
# A separate entry, not a function in every place that reads. There were
# four copies, and one of them discarded the permission denial.

entries:
  # butschster.windows.config:environment
  #
  # The library declares ITS OWN modules, the permissions belong to the
  # process that calls it. The env.get action must be in its policy — today
  # these are shell_runtime, shell_storage, explorer_window and window_scope
  # of display and appwiz.
  - name: environment
    kind: library.lua
    meta:
      comment: Reading the environment — first the process environment, then the file store; a permission denial is distinguishable from "not set", and a default does not hide it.
    source: file://environment.lua
    modules:
      - env
      - logger

  # butschster.windows.config:system
  #
  # Runtime figures for "Task Manager", "System Properties" and "Network
  # Neighborhood" — a value or a reason for each field. The permissions belong
  # to the window that calls (system.read in its policy).
  - name: system
    kind: library.lua
    meta:
      comment: Runtime snapshot for system windows — a value or a reason for each field; a permission denial is distinguishable from "no cluster".
    source: file://system.lua
    modules:
      - system
