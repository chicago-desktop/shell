organization: chicago
module: shell
description: The Chicago shell for the terminal desktop, in the look of the mid-nineties desktops — a teal desktop, a taskbar with the "Start" button and a clock, a program menu built from the registry, and a shortcut layout that the user moves around.
license: MIT
repository: https://github.com/chicago-desktop/shell
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - shell
  - chicago
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  # The interim icon set (assets/icons, docs/icons.md "License") ships with
  # the module since 2026-09-15: the owner
  # made every repository and every Hub module public, so the package carries
  # the same files as the repository. Without the PNGs the shell would draw
  # the icons with primitives (`images.get` refuses with a reason).
# Module directories are not packed by themselves: `wippy publish` packs the
# entries of src/ and embeds only the fs.directory entries named here (they
# become fs.embed in the package). Without this list the published shell would
# have no icons, no wallpapers and no fonts.
embed:
  - chicago.shell.theme:icon_files
  - chicago.shell.theme:fonts
  - chicago.shell.display:wallpaper_files
