organization: butschster
module: windows
description: A Windows 95-style shell for the terminal desktop — a teal desktop, a taskbar with the "Start" button and a clock, a program menu built from the registry, and a shortcut layout that the user moves around.
license: MIT
repository: https://github.com/wippy-windows/windows
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - shell
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  # Windows 95/98 icons are Microsoft artwork and do not fall under MIT
  # (docs/icons.md, "License"). The PNGs are excluded, not the whole
  # `assets/**`: `SOURCE.md` ships, and the `icon_files` directory exists in the
  # published module. Without the directory the runtime does not create the
  # `fs.directory` entry with `auto_init: false` (NewFS → OpenRoot), whereas
  # without the PNGs `images.get` refuses with a reason and the icons are drawn
  # with primitives.
  - "assets/icons/**/*.png"
