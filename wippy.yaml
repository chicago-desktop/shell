organization: butschster
module: windows
description: Оболочка терминального десктопа в стиле Windows 95 — бирюзовый рабочий стол, панель задач с «Пуском» и часами, меню программ из реестра и раскладка ярлыков, которую двигает пользователь.
license: MIT
repository: https://github.com/wippy-projects/windows
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - shell
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  # Значки Windows 95/98 — артворк Microsoft, под MIT не подпадают (docs/icons.md,
  # «Лицензия»). Исключены PNG, а не весь `assets/**`: `SOURCE.md` едет, и
  # каталог `icon_files` в опубликованном модуле есть. Без каталога запись
  # `fs.directory` с `auto_init: false` рантайм не создаёт (NewFS → OpenRoot),
  # а без PNG `images.get` отказывает с причиной и значки рисуются примитивами.
  - "assets/icons/**/*.png"
