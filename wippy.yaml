organization: windows
module: shell
description: A Windows 95-style shell for the terminal desktop — a teal desktop, a taskbar with the "Start" button and a clock, a program menu built from the registry, and a shortcut layout that the user moves around.
license: MIT
repository: https://github.com/wippy-windows/windows
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - shell
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  # The Windows 95/98 icons (assets/icons, Microsoft artwork from shell32.dll,
  # docs/icons.md "License") ship with the module since 2026-09-15: the owner
  # made every repository and every Hub module public, so the package carries
  # the same files as the repository. Without the PNGs the shell would draw
  # the icons with primitives (`images.get` refuses with a reason).
