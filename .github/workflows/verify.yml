name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Здесь только то, что проверяемо без рантайма.
#
# Полный `make verify` (линт и наборы) в CI не идёт и зелёным его не
# притворяется. Ему нужна локальная сборка рантайма с модулем `gfx` — в
# релизном wippy его нет, и модуль, объявляющий `gfx`, релизным рантаймом не
# грузится вовсе, — и основа по соседству: `.wippy.yaml` подменяет
# `butschster/tui-desktop` рабочей копией `../kickside-module`. Ни того, ни
# другого у раннера нет. Зелёный прогон здесь значит «идентичность, ссылки,
# документы и поздние local в порядке», а не «наборы прошли».
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Module checks (identity, docs, links, credentials)
        run: make check

      - name: Late locals (read as globals, fail silently)
        run: |
          python3 tools/late-locals.py src
          python3 tools/late-locals.py test

      - name: Checks leave the tree untouched
        run: git diff --exit-code
