name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Only what can be checked without the runtime runs here.
#
# The full `make verify` (lint and suites) does not run in CI and does not
# pretend to be green. It needs a local runtime build with the `gfx` module —
# the release wippy does not have it, and a module that declares `gfx` does
# not load at all under the release runtime — and the base next door:
# `.wippy.yaml` replaces `butschster/tui-desktop` with the working copy
# `../kickside-module`. The runner has neither. A green run here means
# "identity, links, docs and late locals are in order", not "the suites
# passed".
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Module checks (identity, docs, links, credentials)
        run: make check

      - name: Late locals (read as globals, fail silently)
        run: |
          python3 tools/late-locals.py src
          python3 tools/late-locals.py test

      - name: Checks leave the tree untouched
        run: git diff --exit-code
