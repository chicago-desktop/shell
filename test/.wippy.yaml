version: "1.0"
# Strict security mode requires every process to carry an actor and scope.
# The harness therefore depends on wippy/security (policy groups for
# host-managed services) and on a wippy/test runner that declares
# meta.command.security. `make setup` resolves the harness graph fresh with
# `wippy update`; suites run with `wippy test`.
workspace:
  replacements:
    butschster/windows: ..
    # The base is not in the Hub yet — it is taken from the neighboring working
    # copy. Remove together with the replacement in the root .wippy.yaml once
    # the base is published.
    butschster/tui-desktop: ../../kickside-module
override:
  "butschster.tui_desktop:exec:default_env.HOME": "${env:HOME}"
  "butschster.tui_desktop:exec:default_env.PATH": "${env:PATH}"
  "butschster.windows.security:user_security_scope:data.default": app:user
  # The base arrives transitively and asks the application for the same group.
  # Without a value, linking fails on its requirement, and the message points at
  # someone else's namespace — it reads as a defect of the base, which it is not.
  "butschster.tui_desktop.security:user_security_scope:data.default": app:user
vars:
  pg_host: localhost
  pg_port: 5433
  # <org>_test_<module>: harnesses of different organizations share one
  # Postgres server without colliding on database names.
  pg_database: butschster_test_windows
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      "app:db:kind": db.sql.postgres
      "app:db:host": "${pg_host}"
      "app:db:port": "${pg_port}"
      "app:db:database": "${pg_database}"
      "app:db:username": "${pg_username}"
      "app:db:password": "${pg_password}"
      "app:db:options.sslmode": disable
      "app:db:pool.max_open": 16
      "app:db:pool.max_idle": 8
