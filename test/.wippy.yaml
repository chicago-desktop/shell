version: "1.0"
# Strict security mode requires every process to carry an actor and scope.
# The harness therefore depends on wippy/security (policy groups for
# host-managed services) and on a wippy/test runner that declares
# meta.command.security. `make setup` resolves the harness graph fresh with
# `wippy update`; suites run with `wippy test`.
workspace:
  replacements:
    butschster/windows: ..
    # Основа ещё не в Hub — берётся из рабочей копии по соседству. Убрать
    # вместе с заменой в корневом .wippy.yaml, когда основа опубликована.
    butschster/tui-desktop: ../../kickside-module
override:
  "butschster.windows.security:user_security_scope:data.default": app:user
  # Основа приезжает транзитивно и просит ту же группу у приложения. Без
  # значения линковка падает на её требовании, и сообщение указывает на чужой
  # namespace — читается как дефект основы, которым не является.
  "butschster.tui_desktop.security:user_security_scope:data.default": app:user
vars:
  pg_host: localhost
  pg_port: 5433
  # <org>_test_<module>: харнессы разных организаций делят один сервер
  # Postgres, не сталкиваясь именами баз.
  pg_database: butschster_test_windows
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      "app:db:kind": db.sql.postgres
      "app:db:host": "${pg_host}"
      "app:db:port": "${pg_port}"
      "app:db:database": "${pg_database}"
      "app:db:username": "${pg_username}"
      "app:db:password": "${pg_password}"
      "app:db:options.sslmode": disable
      "app:db:pool.max_open": 16
      "app:db:pool.max_idle": 8
