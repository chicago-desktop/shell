  # ─── AntiBug (FR-009 §3): does a funcs call honour the callee's declared actor? ───
  # A probe with its own `security` block and the same probe without one; the
  # test calls them as itself and as a narrow caller it builds, and reads who
  # they ran as and what they could do.
  - name: antibug_probe_grant
    kind: security.policy
    meta:
      comment: The one grant of the AntiBug actor probe, an action nobody else is given.
    policy:
      actions:
        - antibug.probe
      resources: "*"
      effect: allow

  - name: antibug_narrow_grant
    kind: security.policy
    meta:
      comment: The narrow caller the test builds may only call the two probes.
    policy:
      actions:
        - funcs.call
      resources:
        - app:antibug_actor_probe
        - app:antibug_actor_plain
      effect: allow

  - name: antibug_actor_probe
    kind: function.lua
    meta:
      comment: Reports its actor and whether it may probe — a function entry with its own declared actor and policy.
    source: file://antibug_actor_probe.lua
    method: run
    modules: [security]
    security:
      actor:
        id: app:antibug_actor_probe
      policies:
        - app:antibug_probe_grant

  # The control: the same probe without a `security` block.
  - name: antibug_actor_plain
    kind: function.lua
    meta:
      comment: The AntiBug actor probe without a security block of its own — the control of the measurement.
    source: file://antibug_actor_probe.lua
    method: run
    modules: [security]

  - name: antibug_actor_test
    kind: function.lua
    meta:
      type: test
      group: Windows Shell
      suite: windows_shell
      comment: AntiBug FR-009 §3 — a funcs call runs the callee under the actor its entry declares, its declared policies added to the caller's scope; measured as the runner and as a narrow caller, against a probe without a security block.
    source: file://antibug_actor_test.lua
    method: run
    modules: [security, funcs]
    imports:
      test: wippy.test:test

