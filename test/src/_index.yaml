  # AntiBug FR-009 §4a: output captured from the real tools, and a Go module
  # scanned as a `go` target by the live case.
  - name: antibug_fixtures
    kind: fs.directory
    meta:
      comment: AntiBug's captured runner output (wippy.txt, go.jsonl) and the Go module of its live target.
    base: project
    directory: ./fixtures/antibug
    auto_init: false

  # A target declared the way an application declares one; the directory is
  # relative to the runtime's working directory, test/, where `wippy test` runs.
  - name: antibug_go_target
    kind: registry.entry
    meta:
      type: windows.antibug_target
      title: AntiBug fixture (Go)
      kind: go
      dir: fixtures/antibug/gomod
      order: 1
      # exec.native gives the child nothing of the runtime's environment:
      # go needs PATH, and a HOME or its cache directories.
      env:
        HOME: /tmp/antibug-go-home
        GOCACHE: /tmp/antibug-gocache
        GOPATH: /tmp/antibug-gopath
        PATH: /usr/local/go/bin:/snap/bin:/usr/local/bin:/usr/bin:/bin
      comment: A tiny Go module with a pass, a failure and a skip, for the live scan of a go target.

  - name: antibug_targets_test
    kind: function.lua
    meta:
      type: test
      group: Windows Shell
      suite: windows_shell
      comment: AntiBug FR-009 §4a — the wippy runner and go test -json parsers on captured output, the declarations and commands, a target's state machine in the model and the window, and a live Go target through the real runner, target process and exec.
    source: file://antibug_targets_test.lua
    method: run
    modules: [channel, time, fs]
    imports:
      test: wippy.test:test
      app: windows.shell.sdk:app
      scan: windows.shell.antibug:scan
      targets: windows.shell.antibug:targets
      antibug_window: windows.shell.antibug:window
