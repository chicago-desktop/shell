version: "1.0"
namespace: app

# Standalone harness for chicago/shell. Provides the host resources the
# boot needs (app:db, app:processes, gateway + api router, env storage, a
# permissive actor scope) and wires them through wippy/bootloader so the
# co-located *_test.lua suites run in isolation. The router exists only so the
# endpoint entries resolve; the suites call the libraries directly.
#
# The shell can also be brought up from here by hand, without the application:
#   cd test && wippy run --host chicago.shell:terminal chicago
# Harness-only; excluded from publish via the module wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: Windows Shell Test Harness }

  - name: storage_test
    kind: function.lua
    meta:
      type: test
      comment: The layout survives the round "created — read — moved — deleted", a broken shortcut stays and is marked, a deleted shortcut does not come back.
      group: Windows Shell
      suite: chicago_shell
    source: file://storage_test.lua
    modules: [sql, env, json, time, uuid, registry]
    imports:
      test: wippy.test:test
      repo: chicago.shell.persist:repo
      catalog: chicago.shell.programs:catalog
      seed: chicago.shell.programs:seed
      view: chicago.shell.programs:desktop_view
      desktop_body: chicago.shell.api:desktop_body
    method: run

  - name: catalog_test
    kind: function.lua
    meta:
      type: test
      comment: The catalog builds menu folders from meta.group, tells an empty catalog and an unreadable registry apart by different values, hides from the menu what asked to be hidden, does not create a folder without content, and names an unknown window type without hiding the program.
      group: Windows Shell
      suite: chicago_shell
    source: file://catalog_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      catalog: chicago.shell.programs:catalog
      view: chicago.shell.programs:desktop_view
      chrome: chicago.shell.theme:chrome
      model: chicago.shell.explorer:model
    method: run

  - name: defaults_test
    kind: function.lua
    meta:
      type: test
      comment: Desk furniture is created once, furniture that was thrown away does not come back, a shortcut to a missing program is skipped rather than created broken.
      group: Windows Shell
      suite: chicago_shell
    source: file://defaults_test.lua
    modules: [sql, env, json, time, uuid, registry, tty]
    imports:
      test: wippy.test:test
      repo: chicago.shell.persist:repo
      defaults: chicago.shell.programs:defaults
      seed: chicago.shell.programs:seed
      chrome: chicago.shell.theme:chrome
    method: run

  - name: explorer_test
    kind: function.lua
    meta:
      type: test
      comment: The "My Computer" window shows the stand itself, makes a drive of every fs entry, reads the path the same way for a click and for the "Up" button, describes a double click as an intent, and nowhere substitutes the word "empty" for "not read".
      group: Windows Shell
      suite: chicago_shell
    source: file://explorer_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      model: chicago.shell.explorer:model
    method: run

  - name: sources_test
    kind: function.lua
    meta:
      type: test
      comment: Drives come from the live registry, not from a table of our own; drive content is read by the fs module; a closed drive answers with a reason, not with emptiness; the top level of the desktop and the desktop folder do not show the same thing twice.
      group: Windows Shell
      suite: chicago_shell
    source: file://sources_test.lua
    modules: [fs, registry, sql, env, time, uuid, tty, process, channel]
    imports:
      test: wippy.test:test
      model: chicago.shell.explorer:model
      repo: chicago.shell.persist:repo
      sources: chicago.shell.explorer:sources
    method: run

  - name: explorer_window_test
    kind: function.lua
    meta:
      type: test
      comment: The folder window on the SDK (FR-008) — every menu item through update, open or focus, Backspace in both browse modes, the toggles, the context menus, the Options sheet, the four views laid out at 48×16 and 72×22 in both modes, List as column-filled icons with test/shots/folder-list.png, and the window alive in a viewport.
      group: Windows Shell
      suite: chicago_shell
    source: file://explorer_window_test.lua
    modules: [tty, process, channel, time, gfx, fs]
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      app: chicago.shell.sdk:app
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
      model: chicago.shell.explorer:model
      explorer_window: chicago.shell.explorer:window
    method: run

  - name: chrome_test
    kind: function.lua
    meta:
      type: test
      comment: Title buttons — each window type has its own set, an unknown type counts as an ordinary window, exactly what is drawn is what gets pressed; the fill is called in both themes, and the styles live in one table, not in two similar ones; the pixel desktop names the reason for an unreadable layout, and the taskbar shows the status line.
      group: Windows Shell
      suite: chicago_shell
    source: file://chrome_test.lua
    modules: [tty, gfx, registry, fs]
    imports:
      test: wippy.test:test
      catalog: chicago.shell.programs:catalog
      chrome: chicago.shell.theme:chrome
      chrome_pixels: chicago.shell.theme:chrome_pixels
      widgets: chicago.shell.theme:widgets
      pixels: chicago.shell.theme:pixels
      desktop_pixels: chicago.tui_desktop.desktop:pixels
      menu_layout: chicago.shell.theme:menu_layout
      placements: chicago.shell.theme:placements
    method: run

  - name: images_test
    kind: function.lua
    meta:
      type: test
      comment: Windows 95 icon pack — every name decodes at 32 and 16, the raster is cached, an unknown name and a foreign size refuse with a reason, the shortcut overlay lands in the raster.
      group: Windows Shell
      suite: chicago_shell
    source: file://images_test.lua
    modules: [gfx, registry, fs]
    imports:
      test: wippy.test:test
      images: chicago.shell.theme:images
    method: run

  - name: shell_test
    kind: function.lua
    meta:
      type: test
      comment: The shell comes up on the test viewport and rereads the layout on the endpoint's command; a shell that was shut down is distinguished from a failure.
      group: Windows Shell
      suite: chicago_shell
    source: file://shell_test.lua
    modules: [channel, process, registry, sql, env, time, tty, uuid]
    imports:
      test: wippy.test:test
      control: chicago.shell.api:control
      repo: chicago.shell.persist:repo
    method: run

  - name: glyphs_test
    kind: function.lua
    meta:
      type: test
      comment: Every glyph in the set takes exactly one cell, and both palette sets carry the same names — otherwise some detail gets painted "however it turns out".
      group: Windows Shell
      suite: chicago_shell
    source: file://glyphs_test.lua
    modules: [tty]
    imports:
      test: wippy.test:test
      glyphs: chicago.shell.theme:glyphs
      palette: chicago.shell.theme:palette
    method: run

  - name: wiring_test
    kind: function.lua
    meta:
      type: test
      comment: The host, the shell process, the explorer window, the endpoints and the policies exist and reference each other; the terminal host log is silenced, the layout endpoints and the window have no right to spawn processes, there is no program-creation endpoint, and the desk furniture points at existing entries.
      group: Windows Shell
      suite: chicago_shell
    source: file://wiring_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      defaults: chicago.shell.programs:defaults
      repo: chicago.shell.persist:repo
    method: run

  # A program WITH A GROUP. Added on purpose: the harness had not a single
  # entry with `meta.group`, and the whole path "group → folder → expansion" was
  # green without ever having been walked on real registry entries. The defect
  # that kept the folder from being created lived in that gap.
  - name: grouped_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Probe in a folder
      group: System Tools/Probe
      comment: An entry with a group — so that the catalog builds menu folders on the real registry, not only in a pure test.
    source: file://grouped_probe.lua
    method: main
    modules: [channel]
    security:
      policies: [app:probe_scope]

  # A real file system in the registry. Without it, "drives come from the
  # registry" would be checked on made-up entries, that is, not checked at all:
  # had we got the filter name wrong, the test would have stayed green.
  #
  # The directory chosen is the one the test suite itself lives in: it is
  # certain to exist and certain not to be empty, which means "read emptiness"
  # and "read" are distinguishable here.
  - name: probe_fs
    kind: fs.directory
    meta:
      comment: The harness file system — it is the drive under test.
    base: project
    directory: ./src

  # The second level of the pixel probe: a command that draws a frame and
  # saves a PNG. It lives in the harness, not in the module: a snapshot is a
  # check, not part of the shell, and it does not ship.
  #
  #   cd test && wippy run --host wippy.terminal:host paint-png
  - name: paint_png
    kind: process.lua
    meta:
      comment: Draws the pixel primitives with the real gfx and saves a PNG into test/shots — the only way to see a glyph, an edge and a color.
      command:
        name: paint-png
        short: Draw the pixel primitives and save a PNG
    source: file://paint_png.lua
    method: main
    modules:
      - fs
      - gfx
    security:
      policies: [app:probe_scope]
    imports:
      chrome: chicago.shell.theme:chrome
      chrome_pixels: chicago.shell.theme:chrome_pixels
      pixels: chicago.shell.theme:pixels
      rasters: chicago.shell.theme:rasters
      ui: chicago.shell.sdk:ui
      explorer_window: chicago.shell.explorer:window
      sdk_render: chicago.shell.sdk:render
      sysprops_window: chicago.shell.sysprops:window
      sysprops_model: chicago.shell.sysprops:model
      display_window: chicago.shell.display:window
      images: chicago.shell.theme:images
      catalog: chicago.shell.programs:catalog
      desktop_view: chicago.shell.programs:desktop_view
      model: chicago.shell.explorer:model
      widget_scene: app:widget_scene

  # The probe's permissions are named, not taken from the harness's general
  # permissive policy: `fs.get` is access to a file system by its registry
  # entry, and a check that was granted everything will not notice that the
  # stand lacks permissions.
  - name: probe_scope
    kind: security.policy
    meta:
      comment: Permissions of the pixel probe — read a font and write a snapshot; nothing more.
    policy:
      actions:
        - process.context
        - fs.get
      resources: "*"
      effect: allow

  # Snapshot directory. It is written to, so auto_init is on; the font
  # store below is read-only — the application must not try to create
  # it or change its permissions.
  # app:test_images — an image pack declared the way any module declares one:
  # an fs entry with meta.type chicago.images, pictures as <size>/<file>.png.
  - name: test_images
    kind: fs.directory
    meta:
      type: chicago.images
      comment: A test image pack — how another module brings pictures to the shell.
    base: project
    directory: ./fixtures/images
    auto_init: false

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the pixel probe PNGs go.
    base: project
    directory: ./shots
    auto_init: true

  # app:override_fonts — the module's three font files under another id, for
  # the case where CHICAGO_FONTS names a store other than the module's own.
  # The harness has NO app:system_fonts: the suites read the module's
  # chicago.shell.theme:fonts, which proves the shell needs no font package.
  - name: override_fonts
    kind: fs.directory
    meta:
      comment: The module's fonts under another id — the store CHICAGO_FONTS names in fonts_test.
    base: project
    directory: ../assets/fonts
    auto_init: false

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the harness does not use it, but the loader asks for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The endpoint entries resolve against these resources at boot; no suite
  # calls them over HTTP — the wiring suite checks registry shape.
  - name: gateway
    kind: http.service
    addr: :19229
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it. The replacement in
  # .wippy.yaml substitutes the working copy from ../ here, so the source and
  # the co-located tests load directly, without publishing.
  - name: chicago_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/shell"
    parameters:
      - name: chicago.shell:api_router
        value: app:api

  - name: chicago_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migration dependency used by the module under test.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: chicago_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups (wippy.security:process) that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: chicago_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: window_images
    kind: registry.entry
    meta:
      type: chicago.program_images
      comment: A window icon without its own meta.image — checks reading the declaration from the registry.
    data:
      images:
        "app:grouped_probe": clock

  - name: taskbar_clock
    kind: registry.entry
    meta:
      type: chicago.taskbar_clock
      comment: Clock binding fixture.
    data:
      entry: app:grouped_probe

  - name: viewers_test
    kind: function.lua
    meta:
      type: test
      comment: Viewers — the window argument is built and parsed in one shape, a type registry from meta.opens with conflicts settled by name, a picture frame exactly the size of the window, and the same raster when nothing changed.
      group: Windows Shell
      suite: chicago_shell
    source: file://viewers_test.lua
    modules: [gfx, base64]
    imports:
      test: wippy.test:test
      files: chicago.shell.viewers:files
      associations: chicago.shell.viewers:associations
      picture_render: chicago.shell.viewers:picture_render
    method: run

  - name: views_test
    kind: function.lua
    meta:
      type: test
      comment: View windows — the month grid, buttons in cells without shared cells, a second resends only the clock; a fixed window has no "maximize".
      group: Windows Shell
      suite: chicago_shell
    source: file://views_test.lua
    modules: [gfx, tty, registry, fs]
    imports:
      test: wippy.test:test
      rasters: chicago.shell.theme:rasters
      pixels: chicago.shell.theme:pixels
      widgets: chicago.shell.theme:widgets
      chrome: chicago.shell.theme:chrome
      chrome_pixels: chicago.shell.theme:chrome_pixels
      ui: chicago.shell.sdk:ui
    method: run

  - name: environment_test
    kind: function.lua
    meta:
      type: test
      comment: Environment reading — a permission refusal is distinguishable from "not set", the default does not hide it, the process environment takes precedence over the file storage.
      group: Windows Shell
      suite: chicago_shell
    source: file://environment_test.lua
    imports:
      test: wippy.test:test
      environment: chicago.shell.config:environment
    method: run

  - name: fonts_test
    kind: function.lua
    meta:
      type: test
      comment: The shell's own fonts — the module's store is read with no system font folder in the harness, every face draws a caption, and CHICAGO_FONTS still names another store.
      group: Windows Shell
      suite: chicago_shell
    source: file://fonts_test.lua
    method: run
    modules: [fs, gfx, registry]
    imports:
      test: wippy.test:test
      font_set: chicago.shell.theme:font_set

  - name: display_test
    kind: function.lua
    meta:
      type: test
      comment: Display properties — the color shape and the resolution label, four tabs without overlaps in cells and at 8×16 and 10×20, the Windows 95 metrics, choosing a color and a pattern and applying through a substituted entry, OK after a successful write; the theme repaints the desktop through a single point.
      group: Windows Shell
      suite: chicago_shell
    source: file://display_test.lua
    modules: [sql, env, time, uuid, tty]
    imports:
      test: wippy.test:test
      model: chicago.shell.display:model
      ui: chicago.shell.sdk:ui
      render: chicago.shell.sdk:render
      display_window: chicago.shell.display:window
      chrome: chicago.shell.theme:chrome
      chrome_pixels: chicago.shell.theme:chrome_pixels
      widgets: chicago.shell.theme:widgets
      palette: chicago.shell.theme:palette
    method: run

  - name: sysprops_test
    kind: function.lua
    meta:
      type: test
      comment: System Properties — the device tree by kind prefix, empty groups with a mark, the layout of three tabs without overlaps, expanding and selecting, OK closes.
      group: Windows Shell
      suite: chicago_shell
    source: file://sysprops_test.lua
    modules: [system, registry]
    imports:
      test: wippy.test:test
      model: chicago.shell.sysprops:model
      ui: chicago.shell.sdk:ui
      sysprops_window: chicago.shell.sysprops:window
    method: run

  - name: programs_live_test
    kind: function.lua
    meta:
      type: test
      comment: New programs — Task Manager, Notepad, picture viewer — are opened by the live shell and answer with a window description; a failure names the reason that the stand hides in the log.
      group: Windows Shell
      suite: chicago_shell
    source: file://programs_live_test.lua
    modules: [channel, process, registry, sql, env, time, tty, uuid]
    imports:
      test: wippy.test:test
      control: chicago.shell.api:control
    method: run

  - name: window_life_test
    kind: function.lua
    meta:
      type: test
      comment: Program windows (Task Manager, Notepad) stay alive after launch — the exit event is read as text, because the stand hides it in the log.
      group: Windows Shell
      suite: chicago_shell
    source: file://window_life_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  - name: sdk_demo
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: SDK Example
      image: program
      group: [SDK, Examples]
      width: 62
      height: 23
      pixel_render: chicago.shell.sdk:render
      pixel_state: app:sdk_demo
    source: file://sdk_demo.lua
    method: main
    modules: [time]
    imports:
      app: chicago.shell.sdk:app
    security:
      policies: [chicago.shell.security:view_state]

  - name: sdk_fixture
    kind: library.lua
    meta: {comment: Declarative app fixture shared by the smoke test and screenshots.}
    source: file://sdk_demo.lua
    modules: [time]
    imports:
      app: chicago.shell.sdk:app

  - name: sdk_test
    kind: function.lua
    meta:
      type: test
      group: Windows SDK
      suite: chicago_shell
      comment: Declarative discovery, shared geometry, scrolling, editing, pixels and live lifecycle.
    source: file://sdk_test.lua
    method: run
    modules: [process, channel, time, tty, fs, gfx, registry]
    imports:
      chrome: chicago.shell.theme:chrome_pixels
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      editor: chicago.shell.sdk:editor
      cells: chicago.shell.sdk:cells
      scroll: chicago.tui_desktop.desktop:scroll
      input: chicago.tui_desktop.desktop:input
      geometry: chicago.tui_desktop.desktop:geometry
      render: chicago.shell.sdk:render
      pixels: chicago.shell.theme:pixels
      rasters: chicago.shell.theme:rasters
      shell_icons: chicago.shell.theme:icons
      fixture: app:sdk_fixture
      catalog: chicago.shell.programs:catalog
      app: chicago.shell.sdk:app
      widgets: chicago.shell.theme:widgets

  - name: workshop_sdk_test
    kind: function.lua
    meta:
      type: test
      group: Windows SDK
      suite: chicago_shell
      comment: A window on the SDK built by the workshop — checks the description, applying it to the registry, starting the process.
    source: file://workshop_sdk_test.lua
    method: run
    modules: [channel, process, registry, time, tty]
    imports:
      test: wippy.test:test
      apps: chicago.tui_desktop.persist:apps

  - name: filedialog_test
    kind: function.lua
    meta:
      type: test
      group: Windows SDK
      suite: chicago_shell
      comment: The Windows 95 Open / Save As sheet — layout at 44×16 in both modes, every action of update, a PNG shot.
    source: file://filedialog_test.lua
    method: run
    modules: [fs, gfx, registry]
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      cells: chicago.shell.sdk:cells
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
      filedialog: chicago.shell.sdk:filedialog

  - name: list_reveal_test
    kind: function.lua
    meta:
      type: test
      group: Windows SDK
      suite: chicago_shell
      comment: SDK list — reveal scrolls to a row once per value.
    source: file://list_reveal_test.lua
    method: run
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui

  - name: logon_test
    kind: function.lua
    meta:
      type: test
      group: Windows SDK
      suite: chicago_shell
      comment: Logon screen — password mask, Enter order, refusal and retry, cancel, the frame in cells and in pixels; the logged-on user's name read again through the application's function.
    source: file://logon_test.lua
    method: run
    modules: [channel, tty, fs, gfx]
    imports:
      test: wippy.test:test
      screen: chicago.shell.logon:screen
      provider: chicago.shell.logon:provider
      chrome_pixels: chicago.shell.theme:chrome_pixels
      ui: chicago.shell.sdk:ui
      cells: chicago.shell.sdk:cells

  - name: sdk_composer
    kind: process.lua
    meta:
      comment: The real compositor and the shell menu on the test viewport.
    source: file://sdk_composer.lua
    method: main
    modules: [process, fs, gfx]
    imports:
      library: chicago.tui_desktop.desktop:library
      chrome: chicago.shell.theme:chrome_pixels
      cell_chrome: chicago.shell.theme:chrome
      catalog: chicago.shell.programs:catalog

  - name: sdk_focus_test
    kind: function.lua
    meta:
      type: test
      comment: A window that loses the keyboard drops its armed button and captured drag, so a later release does not press a button pressed before the focus change; gaining focus releases nothing.
      group: Windows Shell
      suite: chicago_shell
    source: file://sdk_focus_test.lua
    modules: [tty]
    imports:
      test: wippy.test:test
      app: chicago.shell.sdk:app
      ui: chicago.shell.sdk:ui
    method: run

  - name: gadget_test
    kind: function.lua
    meta:
      type: test
      comment: The desktop widget kit — every builder is a plain passive tree ui.problem accepts at the rows the kit promises, and the weather and monitor widgets lay out inside a widget's panel without overlaps in cells and at two pixel cells.
      group: Windows SDK
      suite: chicago_shell
    source: file://gadget_test.lua
    method: run
    imports:
      test: wippy.test:test
      gadget: chicago.shell.sdk:gadget
      gadgets: chicago.shell.theme:gadgets
      ui: chicago.shell.sdk:ui
      charts: chicago.shell.sdk:charts

  - name: gauge_test
    kind: function.lua
    meta:
      type: test
      comment: The gauge's orientation — vertical stays Task Manager's LED meter, horizontal is a Windows 95 progress bar in pixels and in cells, filled by one rule.
      group: Windows SDK
      suite: chicago_shell
    source: file://gauge_test.lua
    method: run
    modules: [tty, gfx]
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      cells: chicago.shell.sdk:cells
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
      palette: chicago.shell.theme:palette
      glyphs: chicago.shell.theme:glyphs

  - name: desktop_widgets_test
    kind: function.lua
    meta:
      type: test
      comment: Desktop widgets in the shell — the right-edge column and its second column, one hit table for both themes, the panel in cells, a placement per row in pixels cut by windows, a changed number re-sending only its rows, the catalog's widget entries and the SDK runner driving a widget.
      group: Windows Shell
      suite: chicago_shell
