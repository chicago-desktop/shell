version: "1.0"
namespace: app

# Standalone harness for butschster/windows. Provides the host resources the
# boot needs (app:db, app:processes, gateway + api router, env storage, a
# permissive actor scope) and wires them through wippy/bootloader so the
# co-located *_test.lua suites run in isolation. The router exists only so the
# endpoint entries resolve; the suites call the libraries directly.
#
# Оболочка отсюда тоже поднимается руками, без приложения:
#   cd test && wippy run --host butschster.windows:terminal windows
# Harness-only; excluded from publish via the module wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: Windows Shell Test Harness }

  - name: storage_test
    kind: function.lua
    meta:
      type: test
      comment: Раскладка переживает круг «создал — прочитал — подвинул — удалил», битый ярлык остаётся и помечен, удалённый ярлык не возвращается.
      group: Windows Shell
      suite: butschster_windows
    source: file://storage_test.lua
    modules: [sql, env, json, time, uuid, registry]
    imports:
      test: wippy.test:test
      repo: butschster.windows.persist:repo
      catalog: butschster.windows.programs:catalog
      seed: butschster.windows.programs:seed
      view: butschster.windows.programs:desktop_view
    method: run

  - name: catalog_test
    kind: function.lua
    meta:
      type: test
      comment: Каталог собирает папки меню из meta.group, различает пустой каталог и нечитаемый реестр разными значениями, прячет из меню то, что просило спрятать, не заводит папку без содержимого и называет неизвестный тип окна, не пряча программу.
      group: Windows Shell
      suite: butschster_windows
    source: file://catalog_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      catalog: butschster.windows.programs:catalog
    method: run

  - name: defaults_test
    kind: function.lua
    meta:
      type: test
      comment: Мебель стола заводится один раз, выброшенная не возвращается, ярлык на отсутствующую программу пропускается, а не заводится битым.
      group: Windows Shell
      suite: butschster_windows
    source: file://defaults_test.lua
    modules: [sql, env, json, time, uuid, registry, tty]
    imports:
      test: wippy.test:test
      repo: butschster.windows.persist:repo
      defaults: butschster.windows.programs:defaults
      seed: butschster.windows.programs:seed
      chrome: butschster.windows.shell:chrome
    method: run

  - name: explorer_test
    kind: function.lua
    meta:
      type: test
      comment: «Мой компьютер» показывает сам стенд, делает диском каждую запись fs, читает путь одинаково для щелчка и для кнопки «Вверх», описывает двойной щелчок намерением и нигде не подменяет «не прочитали» словом «пусто».
      group: Windows Shell
      suite: butschster_windows
    source: file://explorer_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      model: butschster.windows.explorer:model
    method: run

  - name: sources_test
    kind: function.lua
    meta:
      type: test
      comment: Диски приходят из живого реестра, а не из своей таблицы; содержимое диска читается модулем fs; закрытый диск отвечает причиной, а не пустотой; верхний уровень стола и папка стола не показывают одно и то же дважды.
      group: Windows Shell
      suite: butschster_windows
    source: file://sources_test.lua
    modules: [fs, registry, sql, env, time, uuid]
    imports:
      test: wippy.test:test
      model: butschster.windows.explorer:model
      repo: butschster.windows.persist:repo
      sources: butschster.windows.explorer:sources
    method: run

  - name: render_test
    kind: function.lua
    meta:
      type: test
      comment: Сетка значков внутри окна и раскладка как единственная таблица для обоих бэкендов — ряды считаются по рисунку, а не по шагу; прямоугольник, предсказанный планом, совпадает с нарисованным; сдвиг зажимается, а не показывает пустоту за последним рядом.
      group: Windows Shell
      suite: butschster_windows
    source: file://render_test.lua
    modules: [tty]
    imports:
      test: wippy.test:test
      icons: butschster.windows.shell:icons
      render: butschster.windows.explorer:render
    method: run

  - name: chrome_test
    kind: function.lua
    meta:
      type: test
      comment: Кнопки заголовка — у каждого типа окна свой состав, неизвестный тип считается обычным окном, нажимается ровно то, что нарисовано; заливка зовётся у обеих тем, а стили лежат в одной таблице, а не в двух похожих.
      group: Windows Shell
      suite: butschster_windows
    source: file://chrome_test.lua
    modules: [tty, gfx, registry]
    imports:
      test: wippy.test:test
      catalog: butschster.windows.programs:catalog
      chrome: butschster.windows.shell:chrome
      chrome_pixels: butschster.windows.shell:chrome_pixels
      widgets: butschster.windows.shell:widgets
    method: run

  - name: images_test
    kind: function.lua
    meta:
      type: test
      comment: Пакет значков Windows 95 — каждое имя декодируется в 32 и 16, растр кэшируется, неизвестное имя и чужой размер отказывают с причиной, накладка ярлыка ложится в растр.
      group: Windows Shell
      suite: butschster_windows
    source: file://images_test.lua
    modules: [gfx]
    imports:
      test: wippy.test:test
      images: butschster.windows.shell:images
    method: run

  - name: shell_test
    kind: function.lua
    meta:
      type: test
      comment: Оболочка поднимается на viewport теста и перечитывает раскладку по команде ручки; погашенная оболочка отличается от отказа.
      group: Windows Shell
      suite: butschster_windows
    source: file://shell_test.lua
    modules: [channel, process, registry, sql, env, time, tty, uuid]
    imports:
      test: wippy.test:test
      control: butschster.windows.api:control
      repo: butschster.windows.persist:repo
    method: run

  - name: glyphs_test
    kind: function.lua
    meta:
      type: test
      comment: Каждый символ набора занимает ровно одну ячейку, и оба набора палитры несут одни и те же имена — иначе одна деталь красится «как получится».
      group: Windows Shell
      suite: butschster_windows
    source: file://glyphs_test.lua
    modules: [tty]
    imports:
      test: wippy.test:test
      glyphs: butschster.windows.shell:glyphs
      palette: butschster.windows.shell:palette
    method: run

  - name: wiring_test
    kind: function.lua
    meta:
      type: test
      comment: Хост, процесс оболочки, окно проводника, ручки и политики существуют и ссылаются друг на друга; лог терминального хоста заглушён, у ручек раскладки и у окна нет права порождать процессы, ручки создания программы нет, а мебель стола ведёт на существующие записи.
      group: Windows Shell
      suite: butschster_windows
    source: file://wiring_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      defaults: butschster.windows.programs:defaults
    method: run

  # Программа С ГРУППОЙ. Заведена нарочно: в харнессе не было ни одной записи
  # с `meta.group`, и весь путь «группа → папка → раскрытие» был зелёным, ни
  # разу не пройденным на настоящих записях реестра. Дефект, из-за которого
  # папка не заводилась, жил в этом промежутке.
  - name: grouped_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Проба в папке
      group: Служебные/Проверка
      comment: Запись с группой — чтобы каталог собирал папки меню на настоящем реестре, а не только в чистом тесте.
    source: file://grouped_probe.lua
    method: main
    modules: [channel]
    security:
      policies: [app:probe_scope]

  # Настоящая файловая система в реестре. Без неё «диски приходят из реестра»
  # проверялось бы на выдуманных записях, то есть не проверялось бы вовсе:
  # ошиблись бы мы в имени фильтра — тест остался бы зелёным.
  #
  # Каталог выбран тот, в котором лежит сам набор тестов: он заведомо есть и
  # заведомо не пуст, а значит «прочитали пустоту» и «прочитали» здесь
  # различимы.
  - name: probe_fs
    kind: fs.directory
    meta:
      comment: Файловая система харнесса — она и есть проверяемый диск.
    base: project
    directory: ./src

  # Второй уровень пиксельного пробника: команда, которая рисует кадр и
  # кладёт PNG. Живёт в харнессе, а не в модуле: снимок — это проверка, а не
  # часть оболочки, и в поставку он не едет.
  #
  #   cd test && wippy run --host wippy.terminal:host paint-png
  - name: paint_png
    kind: process.lua
    meta:
      comment: Рисует пиксельные примитивы настоящим gfx и кладёт PNG в test/shots — единственный способ увидеть глиф, грань и цвет.
      command:
        name: paint-png
        short: Нарисовать пиксельные примитивы и положить PNG
    source: file://paint_png.lua
    method: main
    modules:
      - fs
      - gfx
    security:
      policies: [app:probe_scope]
    imports:
      chrome_pixels: butschster.windows.shell:chrome_pixels
      pixels: butschster.windows.shell:pixels
      rasters: butschster.windows.shell:rasters
      render: butschster.windows.explorer:render
      render_pixels: butschster.windows.explorer:render_pixels

  # Права пробника названы, а не взяты у общей разрешительной политики
  # харнесса: `fs.get` — это доступ к файловой системе по записи реестра, и
  # проверка, которой выдали всё, не заметит, что на стенде прав не хватает.
  - name: probe_scope
    kind: security.policy
    meta:
      comment: Права пиксельного пробника — прочитать шрифт и записать снимок; ничего больше.
    policy:
      actions:
        - process.context
        - fs.get
      resources: "*"
      effect: allow

  # Каталог снимков. Пишется, поэтому auto_init включён; каталог шрифтов рядом
  # только на чтение — приложение не должно пытаться его создавать и
  # переставлять права.
  - name: shots
    kind: fs.directory
    meta:
      comment: Куда кладутся PNG пиксельного пробника.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: Системные шрифты TrueType, только для чтения — шрифт приезжает в gfx байтами, а не путём.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — харнесс его не использует, но загрузчик просит ресурс.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The endpoint entries resolve against these resources at boot; no suite
  # calls them over HTTP — the wiring suite checks registry shape.
  - name: gateway
    kind: http.service
    addr: :19229
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # Харнесс тестирует модуль, значит зависит от него. Замена в .wippy.yaml
  # подставляет сюда рабочую копию из ../, поэтому исходник и колокейтед
  # тесты грузятся напрямую, без публикации.
  - name: windows_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: Модуль под тестом; источник подменяется на ../ в .wippy.yaml.
    component: "butschster/windows"
    parameters:
      - name: butschster.windows:api_router
        value: app:api

  - name: windows_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migration dependency used by the module under test.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: windows_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups (wippy.security:process) that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: windows_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: window_images
    kind: registry.entry
    meta:
      type: windows.program_images
      comment: Значок окна без своего meta.image — проверка чтения объявления из реестра.
    data:
      images:
        "app:grouped_probe": clock

  - name: taskbar_clock
    kind: registry.entry
    meta:
      type: windows.taskbar_clock
      comment: Clock binding fixture.
    data:
      entry: app:grouped_probe

  - name: viewers_test
    kind: function.lua
    meta:
      type: test
      comment: Просмотрщики — аргумент окна собирается и разбирается одной формой, реестр типов из meta.opens со спором по имени, кадр картинки ровно размера окна и тот же растр без изменений.
      group: Windows Shell
      suite: butschster_windows
    source: file://viewers_test.lua
    modules: [gfx, base64]
    imports:
      test: wippy.test:test
      files: butschster.windows.viewers:files
      associations: butschster.windows.viewers:associations
      picture_render: butschster.windows.viewers:picture_render
    method: run
